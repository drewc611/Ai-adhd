# Routing. This file is the whole of what the orchestrator is allowed to decide.
#
# The host session (the "orchestrator") emits one routing decision object. Every field is
# enum valued. There is no free text. The compiler rejects unknown keys and any string that
# is not a member of the enum it belongs to. That is how "the orchestrator never reasons"
# is enforced: it has nowhere to put reasoning.

version: 0

defaults:
  max_branches: 5          # frames per run unless the class or the decision says otherwise
  hard_cap: 9              # above this requires --allow-wide; equals the library size
  min_branches: 3          # below this, clustering is meaningless
  require_confirmation: true   # D5: preview plan, wait for the user, then spawn
  shuffle_frames: true     # delivery order is randomised; collection is unordered

# The only object the orchestrator may produce. Validated with unknown keys rejected.
decision_schema:
  problem_class:
    type: enum
    values: [design_decision, fuzzy_debugging, naming, api_surface, strategy,
             enumerate_options, factual_lookup, mechanical_refactor, single_correct_answer]
    required: true
  n:
    type: integer
    min: 3
    max: 9
    required: false
  frames:
    type: list
    of: frame_id            # must exist in config/frames.yaml; axes must be distinct (D6)
    required: false
  allow_wide:
    type: boolean
    required: false

classes:

  design_decision:
    action: run
    description: A choice between options where the search space, not the facts, is the problem.
    signals:
      - "should I"
      - "which should"
      - "how should we"
      - "what should I set"
      - "trade-off"
    frames: [frame_breaker, actor_census, ledger, door_keeper, minimalist]
    alternates: [particularist, night_operator, saboteur, mechanic]

  fuzzy_debugging:
    action: run
    description: A symptom that does not name its cause.
    signals:
      - "sometimes"
      - "intermittent"
      - "every N minutes"
      - "where should I look"
      - "no idea why"
    frames: [mechanic, particularist, saboteur, night_operator, frame_breaker]
    alternates: [actor_census, door_keeper, minimalist, ledger]

  naming:
    action: run
    description: Choosing a name for a thing people will read for years.
    signals:
      - "what should I call"
      - "name for"
      - "rename"
    frames: [particularist, frame_breaker, actor_census, door_keeper, minimalist]
    alternates: [night_operator, ledger, saboteur, mechanic]

  api_surface:
    action: run
    description: What to expose, to whom, in what shape.
    signals:
      - "API"
      - "interface"
      - "signature"
      - "expose"
      - "public"
    frames: [actor_census, door_keeper, saboteur, minimalist, frame_breaker]
    alternates: [particularist, night_operator, ledger, mechanic]

  strategy:
    action: run
    description: A direction with a long detection latency on being wrong.
    signals:
      - "roadmap"
      - "should we invest"
      - "long term"
      - "bet"
    frames: [frame_breaker, ledger, door_keeper, saboteur, particularist]
    alternates: [actor_census, minimalist, night_operator, mechanic]

  enumerate_options:
    action: run
    description: The asker explicitly wants several directions.
    signals:
      - "a few ways to"
      - "some options for"
      - "different approaches"
    frames: [frame_breaker, actor_census, ledger, door_keeper, minimalist, particularist,
             saboteur, night_operator, mechanic]
    n: 7                      # wide by default; still below hard_cap
    alternates: []

  factual_lookup:
    action: decline
    reason: One correct answer exists. Divergence costs N times the tokens and finds nothing.
    signals:
      - "what is the"
      - "when was"
      - "how many"
      - "syntax for"

  mechanical_refactor:
    action: decline
    reason: The change is specified. Do it, do not deliberate about it.
    signals:
      - "rename all"
      - "convert to"
      - "migrate this file"
      - "extract into"

  single_correct_answer:
    action: decline
    reason: The prompt has one right answer and asks for it. Answer directly.
    signals:
      - "does this compile"
      - "what does this error mean"
      - "is this valid"
