# The motivating failure. Regression test for the whole system.
# If a run only returns the timeout triple, the run failed.
#
# Fixture schema:
#   id, name, problem_class, prompt (verbatim; the harness hashes this)
#   must_surface: each item passes if ANY regex in any_of matches (case insensitive)
#                 anywhere in the synthesis or in a surviving branch artifact
#   must_not:     each item fails the run if its check trips
#   expect:       structural expectations on the run
id: "001"
name: http-timeouts
problem_class: design_decision
seed: 1
prompt: "What timeouts should I set on this HTTP client?"

why: |
  Linear CoT answers 15s to first token, 30s between tokens, 90s absolute, one auto retry,
  and cites Google SRE Book ch. 22. Fluent, conventional, and it never touches the actual
  decision. See README.md. A run passes this fixture only if it surfaces what the linear
  answer cannot.

must_surface:
  - id: human_cancel
    trap: T6
    description: The human waiting is an actor who can cancel. The bail out path is modelled.
    any_of:
      - "cancel"
      - "bail ?out"
      - "abort"
      - "user (can|could|will) (stop|interrupt|give up|close)"
      - "ctrl[- ]?c"
  - id: retry_target_questioned
    trap: T2
    description: |
      "Wait, then retry the same instance" is questioned: either an alternative is named
      (fail over, degraded mode, partial output) or retry amplification against the target
      that is already struggling is called out. A bare "degrade" does not count; the first
      real run matched "degrades that way" in an unrelated sentence.
    any_of:
      - "same (instance|host|model|endpoint|server|target)"
      - "fail ?over"
      - "degraded (mode|response|service)|degrade gracefully"
      - "partial (output|response|result)"
      - "different (instance|host|model|endpoint)"
      - "retry storm"
      - "(retry|retries|retrying)[^.]{0,80}(already|still) (sick|struggling|overloaded|degraded|down)"
      - "(sick|struggling|overloaded) (dependency|upstream|instance|service)"
  - id: retry_cost
    trap: T6
    description: Someone pays for the retry, and the answer says who and in what currency.
    any_of:
      - "token cost"
      - "pays? for"
      - "cost of (the |a )?retry"
      - "bill"
      - "who pays"
  - id: trap_named
    description: At least one trap id with detector output appears in the pruned block.
    scope: pruned
    any_of:
      - "T[1-8]"

must_not:
  - id: triple_only
    description: The recommendation is more than a timeout triple.
    check: min_words_outside
    scope: recommendation
    pattern: "\\d+\\s*(ms|s|sec|seconds?|m|min|minutes?)"
    min_words: 40
  - id: no_verdict
    trap: T5
    description: The recommendation contains a sentence of the form "do X".
    check: must_match
    scope: recommendation
    any_of:
      - "^(set|use|make|expose|give|let|fail|return|do|stop|add|remove|treat|start|drop|route)\\b"
      - "\\.\\s+(set|use|make|expose|give|let|fail|return|do|stop|add|remove|treat|start|drop|route)\\b"

expect:
  pruned_min: 1
  pruned_traps_include_any: [T1, T2, T3]
  monoculture: false
  scatter: false
