# A problem several thousand words long. Backlog 15.
#
# Brief size is the thing this exercises. Every branch gets the problem verbatim, so a long problem
# multiplies by the branch count before anything is spent — 5,014 words here, five times over. The
# D5 preview quotes a token estimate and `adhd cost` has already shown that estimate is about a third
# of the truth, so the failure mode is a user consenting to a number that is wrong at a size where
# being wrong is expensive.
#
# Like fixture 009 this asserts the compiler rather than a run: what matters is that a problem this
# long still hashes, still dispatches, and still reaches every brief byte for byte.
id: "010"
name: long-problem
problem_class: design_decision
seed: 10
