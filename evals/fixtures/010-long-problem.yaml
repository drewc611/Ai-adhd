why: |
  A problem of this size is where verbatim passthrough costs something, which is exactly why it must
  hold. Truncating it, summarising it, or sending only the final question would each make the briefs
  smaller and the run cheaper, and each would break the one contract `problem_hash` exists to enforce.
  D2 says the branches reason about what the user wrote; this fixture is that claim at a size where
  paraphrasing is tempting.

  The byte ceiling is a ceiling and not a target. It is set above what the current renderer produces
  so that a renderer which starts padding every brief fails here rather than in someone's token bill.

expect:
  compiles: true
  brief_bytes_max: 60000
