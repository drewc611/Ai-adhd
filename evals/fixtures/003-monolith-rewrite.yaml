# Strategy. A direction with a long detection latency on being wrong. The consensus answer
# hedges (T5), leans on a named authority (T3), and treats a one-way door as a config
# change (T7).
id: "003"
name: monolith-rewrite
problem_class: strategy
seed: 3
prompt: "Should we rewrite our monolith as microservices over the next year?"

why: |
  Linear CoT says "it depends on your team size and scaling needs", recommends the strangler
  fig pattern, cites Fowler's MonolithFirst, and lists the pros and cons of each side. It never
  asks what the asker is actually trying to buy, never says how anyone would know the bet was
  wrong before the year is spent, never names who carries the pager for thirty services, and
  never treats a rewrite as a door that does not reopen. A passing run does all four and still
  tells the asker what to do first.

must_surface:
  - id: reframe
    trap: T2
    description: Someone rejects the axis in the question. Monolith versus microservices is not the decision; the pain being bought off is.
    any_of:
      - "(what|which) (problem|pain|constraint) (is|are|does) (this|the rewrite|it) (actually |really )?(solv|buy|fix|address)"
      - "the (question|problem|decision) (is not|isn't|is rarely) (monolith|microservices|architecture)"
      - "(deploy(ment)?|release|build) (coupling|cadence|lock ?step|contention)"
      - "team boundar"
      - "conway"
      - "what (would|do) (you|we) (get|lose|gain)"
      - "wrong (question|axis|dichotomy)"
      - "false (choice|dichotomy|binary)"
  - id: one_way_door
    trap: T7
    description: The rewrite is treated as hard to reverse, and the answer says what that changes.
    any_of:
      - "one.way"
      - "irreversib"
      - "(can't|cannot|can not|hard to|expensive to) (easily )?(undo|reverse|go back|put back|merge back)"
      - "reversib"
      - "point of no return"
      - "two.way door"
      - "(un)?merg(e|ing) (them|the services|services) back"
  - id: detection_latency
    description: The answer says how the asker would learn the bet was wrong, and when. This is what makes the class a strategy class.
    any_of:
      - "how (would|will|do) (you|we) know"
      - "(know|tell|learn|find out|discover)[^.]{0,60}(wrong|failing|not working|mistake)"
      - "kill (criteri|signal|switch)"
      - "tripwire"
      - "leading indicator"
      - "(month|quarter|week)s? (in|from now|before)[^.]{0,60}(know|tell|see|signal|evidence)"
      - "(stop|abort|halt|exit) (criteri|condition|signal|rule)"
      - "checkpoint"
  - id: who_pays
    trap: T6
    description: The people who operate, staff, or fund the result are named as actors with a cost.
    any_of:
      - "on.call"
      - "pager"
      - "3 ?a\\.?m"
      - "\\bhir(e|ing)\\b"
      - "headcount"
      - "who (owns|runs|operates|maintains|carries|gets paged|is paged)"
      - "(platform|infra|ops|sre) (team|engineer)"
      - "(the|your) (team|people|engineers) (who|that) (have|has|will) to"
  - id: trap_named
    description: At least one trap id with detector output appears in the pruned block.
    scope: pruned
    any_of:
      - "T[1-8]"

must_not:
  - id: no_authority_crutch
    trap: T3
    description: The recommendation stands without its citations. Strip named authorities and pattern names and at least 60 words of argument remain.
    check: min_words_outside
    scope: recommendation
    pattern: "(fowler|newman|strangler( fig)?|monolith ?first|conway'?s law|amazon|netflix|uber|google|microsoft|shopify|segment|according to [A-Z][a-z]+)"
    min_words: 60
  - id: no_both_sides
    trap: T5
    description: The recommendation is not a pros and cons table. It commits to a direction and a first move.
    check: must_be_imperative
    scope: recommendation
  - id: no_it_depends_verdict
    trap: T5
    description: The bold line of the recommendation does not open by deferring the decision back to the asker.
    check: must_match
    scope: recommendation
    any_of:
      - "^(?!\\s*(it depends|that depends|this depends|there is no (single|one|right) answer))"

expect:
  pruned_min: 1
  pruned_traps_include_any: [T3, T5, T7]
  monoculture: false
  scatter: false
