clusters:
  - id: single_global_timeout
    action: "Set one overall client-level timeout value and treat the timeout question as closed until failure data says otherwise."
    members: [MINIMALIST]
    singleton: true
    strongest_objection: null
  - id: measured_connect_read_timeout
    action: "Set explicit connect and read timeout values anchored to the dependency's measured p99 latency and cap retries so they cannot silently multiply the wait."
    members: [LEDGER]
    singleton: true
    strongest_objection: null
  - id: per_phase_adversarial_timeout
    action: "Set a short timeout on every phase of the request (DNS/connect, TLS handshake, read/write, total) sized to bound a stalled or adversarial peer rather than typical latency."
    members: [ACTOR_CENSUS]
    singleton: true
    strongest_objection: null
  - id: deadline_propagation_architecture
    action: "Wire the client so its timeout/cancellation behavior is derived from the caller's own deadline via context propagation, rather than fixed as a single hardcoded client-level number, and gate retries to idempotent operations."
    members: [DOOR_KEEPER, FRAME_BREAKER]
    singleton: false
    strongest_objection: null
