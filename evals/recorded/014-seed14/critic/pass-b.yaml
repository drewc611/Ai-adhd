clusters:
  - id: lock_then_measure
    action: "Edit the crontab line to wrap the existing command in flock -n today, and in the same change start recording per-run duration and every skipped-because-locked event so the bigger scheduler decision is made later from that record."
    members: [LEDGER, DOOR_KEEPER, PARTICULARIST]
    singleton: false
    strongest_objection: "The ordering is backwards in the one case that costs the most. If the overlap is caused by a run that hangs rather than a run that is merely slow, flock -n does not serialize anything - it hands the lock to a process that will never exit, and every subsequent tick is skipped forever. The telemetry proposed alongside it is blind to exactly that: an alert on run duration and a count of skips both depend on runs starting and finishing, and a wedged holder produces no duration at all, while a skip counter climbing steadily looks identical to a guard doing its job. That means the first thing installed should be a hard wall-clock timeout that kills the process group and an alarm on the age of the last successful completion, with the lock second; done in the stated order, the change converts a loud, visible failure into a quiet one and the alarm that would have caught it is the alarm that was not built. Two further gaps: serializing future runs repairs none of the rows already double-written, so if the work is not idempotent there is damage on disk that no amount of later measurement will surface; and a lock file is only mutual exclusion if there is exactly one host and one local filesystem honouring it - if the same crontab entry exists on a second machine, or the lock path sits on a network filesystem, the change buys nothing while the duration graph reports that everything is fine."
  - id: operator_readable_guard
    action: "Rebuild the job's entrypoint so a single run is guarded by a lock whose file names its holder, skipping is loud rather than silent, and a human at a shell can read the state, kill the run, and rerun it by hand without a deploy."
    members: [NIGHT_OPERATOR, ACTOR_CENSUS]
    singleton: false
    strongest_objection: "The proposal quietly contains two different changes with wildly different prices, and it argues for the cheap one while assuming the expensive one. Writing PID and start time into a lock file and making a skipped run log loudly is genuinely a handful of lines. Making each unit of work commit individually, idempotently and resumably so a killed run loses nothing and a rerun redoes nothing is a rewrite of the script's core loop, and it is asserted rather than costed - which matters because the same argument is used to reject other approaches on the grounds that they are expensive infrastructure work. Worse, the two halves undercut each other: if every unit really is committed idempotently and resumably, a second concurrent copy is no longer dangerous, and the exclusive lock the position is named for stops being a correctness mechanism and becomes at most a resource optimisation. Then there is what the design does not touch. Overlap appeared because runtime crossed the interval; a guard makes the crossing survivable and legible at 3am but records nothing about the trend, so the same incident returns with a longer runtime and a better bedside manner. And the whole design rests on a person with a shell on the host that fires the cron. On an ephemeral container, a managed scheduler, or a box only a build pipeline can log into, that actor does not exist, and every control chosen here - cat the lock file, touch a flag, SIGKILL the copy - is unreachable at the moment it is needed."
  - id: instrument_only_then_bound_the_batch
    action: "Change nothing about concurrency now, add structured start and end logging with a run id and an item count, run it for a week, plot duration against volume, then cap the work per run behind a stored watermark."
    members: [FRAME_BREAKER]
    singleton: true
    strongest_objection: null
  - id: leased_idempotent_units
    action: "Restructure the work into named units claimed under expiring leases in a claim table, make processing a unit twice equal to processing it once, wrap every invocation in a timeout that kills the process group, and alert on the age of the last completion instead of on exit codes."
    members: [SABOTEUR]
    singleton: true
    strongest_objection: null
