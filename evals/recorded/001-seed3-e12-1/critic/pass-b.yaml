    T4: { fired: false, evidence: "The forecloses list closes three live decisions (no per-signal tuning, no retry/circuit-breaker design, no per-endpoint values) right now." }
    T5: { fired: false, evidence: "The position is the imperative sentence 'Set one blanket timeout value on the client now, a conservative round number.'" }
    T6: { fired: true, evidence: "Only the downstream service owner is named; caller, operator, attacker, scheduler, and finance are never mentioned." }
    T7: { fired: true, evidence: "It only notes that precision is 'a distinct, later problem' without ever costing out what a wrong blanket value would break or how fast that would surface beyond a week-one log check." }
    T8: { fired: false, evidence: "Flatly restated -- pick one round conservative number now and refine later from evidence -- is still a real, actionable stance worth stating." }
