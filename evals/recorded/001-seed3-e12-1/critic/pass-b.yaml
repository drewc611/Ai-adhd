    T4: { fired: false, evidence: "It forecloses two live options: copying a generic value unchecked against pool size, and pairing the new timeout with unlimited or immediate retries." }
    T5: { fired: false, evidence: "The position opens with the imperative 'Set connect/read timeouts from your own thread and connection pool budget.'" }
    T6: { fired: true, evidence: "It names the on-call engineer, the downstream team, and end users, but never the caller code path, an attacker, the scheduler, or finance/payer explicitly (it even says the currency 'is not money')." }
