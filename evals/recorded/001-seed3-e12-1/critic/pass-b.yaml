clusters:
  - id: minimalist_ship_now
    action: "Ship one conservative blanket timeout value on the client now, with no retry policy, no circuit breaker, and no per-endpoint tuning, and defer everything else until evidence shows it wrong."
    members: [MINIMALIST]
    singleton: true
    strongest_objection: null
  - id: analyze_then_guard
    action: "Before setting a number, derive the timeout from real analysis (own capacity, measured downstream latency, or the propagated deadline budget) and never ship it without a retry/backoff and circuit-breaker policy attached."
    members: [LEDGER, DOOR_KEEPER, FRAME_BREAKER]
    singleton: false
    strongest_objection: null
  - id: push_control_to_caller
    action: "Leave the shared client with only a generous fallback timeout and have each call site set its own per-call deadline as the real control instead of tuning the client's static value."
    members: [ACTOR_CENSUS]
    singleton: true
    strongest_objection: null
traps:
