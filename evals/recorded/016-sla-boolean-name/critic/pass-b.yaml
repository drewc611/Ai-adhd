    T5: { fired: false, evidence: "The position is an explicit imperative, 'Name the field excluded_from_sla_alerts, default false, and stop there,' with a direct do-X verb." }
    T6: { fired: false, evidence: "It names the support agent or team lead who will flip the flag and gives them a concrete action (ask for a visible labeled control), covering the operator actor the question itself omits." }
    T7: { fired: false, evidence: "The whole structure is staged explicitly: ship the cheap boolean now, escalate to a reason-coded or audited field only once a second differing exclusion case actually appears." }
