problem_hash: sha256:b8153a917720624ba348dcfee51b0d3f23d943c750d10a70f599b93d7793783c
pass: B
clusters:
  - id: single_boolean_field
    action: "Add one boolean column to the ticket table, defaulted to false, that the overdue-SLA alert-queue query reads directly to decide inclusion, differing only in the exact string chosen for the name."
    members: [CARETAKER, NEGATIVE_SPACE, MINIMALIST]
    singleton: false
    strongest_objection: null
  - id: audited_suppression_record
    action: "Replace the planned boolean column with a separate suppression-record table (ticket_id, suppressed_by, reason, created_at, expires_at) that the alert-queue query joins against instead of reading a flag off the ticket."
    members: [FRAME_BREAKER]
    singleton: true
    strongest_objection: null
  - id: customer_facing_status
    action: "Default the field to false and add a customer-visible status line on the ticket page stating whether it is being tracked for an overdue alert, instead of keeping the flag backend-only."
    members: [SUPPLICANT]
    singleton: true
    strongest_objection: null
traps:
