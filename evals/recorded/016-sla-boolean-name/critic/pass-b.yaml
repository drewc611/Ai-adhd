    T2: { fired: true, evidence: "The branch works entirely inside the premise that a boolean field is the right mechanism and only contests what to call it, never questioning whether a flat flag can hold the suppression decision at all." }
    T3: { fired: false, evidence: "The four-part reasoning about reuse, load-bearing names, and cost runs on inferred consequences alone, with no citation or authority present to strip out." }
    T4: { fired: false, evidence: "It resolves the one decision asked (the name) and explicitly forecloses two further decisions (no reuse for exemption semantics, no treating suppression and non-breach as the same fact), leaving scope appropriately bounded." }
    T5: { fired: false, evidence: "The position opens with an explicit imperative, 'Name the field narrowly after the mechanism it controls,' which is a direct do-X sentence." }
    T6: { fired: true, evidence: "The only actor named is the downstream reporting/billing owner; the support agent or on-call operator who would actually set this flag day to day is never identified as an actor at all." }
    T7: { fired: false, evidence: "It explicitly weighs a scoped name's cheap future replaceability against an already-reused generic name's expensive unwind, using that asymmetry to justify deciding narrowly now." }
    T8: { fired: false, evidence: "Flattened to 'name the field for what it does, not for the business concept it touches, so misuse is visible at the call site,' the claim still stands as a real naming rule." }
