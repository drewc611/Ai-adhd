clusters:
  - id: local_flock_on_cron_line
    action: "Edit the crontab line so the command runs behind a non-blocking file lock on that host, and make every refused run visible to a human rather than silent."
    members: [PARTICULARIST, LEDGER, MINIMALIST, ACTOR_CENSUS]
    singleton: false
    strongest_objection: "A lock on a file descriptor is scoped to one filesystem, which means it guards the host and not the thing that actually gets damaged. The moment the crontab is copied to a second box, baked into an image that autoscales to two, moved into a container with its own private lock directory, or run on a staging host whose config still points at the production datastore, two runs each acquire their own lock entirely correctly and neither can see the other. Nothing in the problem statement establishes that there is exactly one host now, and nothing keeps it true later. Worse, the failure this introduces is silent and interleaved rather than loud, so it is discovered only when some downstream number looks wrong and someone has to reconstruct intended state from logs that were never written to serve as a reconciliation record. There are two further gaps the mechanism cannot close even on a single host. Exclusion never promised safety, only non-simultaneity, so a run killed mid-write by the OOM killer, a deploy, or a node drain releases the lock cleanly and the next run starts on top of half-finished state, which is the corruption people actually see. And a holder that wedges rather than dies, for example on a socket opened with no timeout, holds the lock forever while every subsequent firing exits immediately, so the skip counter that is supposed to be the instrument reads a job that has done no work in eleven days as a job that is merely being politely serialised. The counter measures refusals, not completions, and those are not the same signal; an alarm on the age of the last successful completion is the one that would catch this, and it is not in the design."
  - id: external_ttl_lease_in_the_datastore
    action: "Move the exclusion out of the filesystem into a row or key in the datastore the job already writes to, with owner, host, run id and expiry, and alarm on the lease or the last successful completion rather than on overlap."
    members: [NIGHT_OPERATOR, SABOTEUR]
    singleton: false
    strongest_objection: "This buys coordination and inspectability by adding exactly the kind of state the current design does not have, and that state is the thing most likely to wedge you. A lock held on a file descriptor is released by the kernel however the process dies; a lease recorded outside the process is not, because nothing ties the record to the life of the holder. So the expiry has to carry all of that weight, and it cannot: set it shorter than the worst real run and it lapses under a live holder, handing the lease to a second runner in good faith and permitting precisely the concurrency it exists to prevent, and that failure is not hypothetical since a paused VM, a long garbage collection pause, or a brief partition between the runner and the datastore produces it without anything being wrong with the code. Set it longer and a run killed at the wrong moment blocks every later run for the remainder of the window until a person clears it by hand. Idempotent keyed writes shrink the blast radius of the first case but do not save a read-modify-write counter and do not save an external side effect with no idempotency key on the far side, and closing that properly needs fencing tokens the storage layer itself enforces, which a database plus a Python script does not provide. There is also a scope objection underneath the mechanism. The recovery apparatus is justified by a responder working backwards from a symptom several hops away at three in the morning, but nothing establishes that anyone has ever been paged for this job, and if the rotation does not already hold write credentials on that datastore the runbook verb they are promised does not exist. Finally, none of this touches the rate. If the script now takes longer than its interval, a lease decides which firings to discard just as a file lock does; it changes what the discard is recorded in, not whether the work is falling behind."
  - id: supervised_serial_loop
    action: "Delete the cron entry and run the script under a supervisor that starts the next execution only after the previous one exits, with a hard kill timeout per execution."
    members: [MECHANIC]
    singleton: true
    strongest_objection: null
