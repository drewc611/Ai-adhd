    Any retry policy shipping in this change — no retries at all go in until the idempotency
    question is answered in writing, which rules out the common "3 retries with exponential
    backoff" default that most HTTP client wrappers arrive with.
  - >-
    Deriving the timeout from the dependency's published SLA or from a number copied out of
    another service's config, since the position commits to the dependency's own measured
    histogram as the only input that decides the value.
  - >-
    A generous starting value chosen to avoid false failures — 30s or 60s, or the library
    default — which is the move that keeps the decision comfortable and pushes detection of
    being wrong out past the first traffic peak.
  - >-
    Refactoring now to caller-supplied deadlines and context propagation, which stays shut
    until the histogram or a discovered sequential fan-out justifies it.
falsifier: >-
  One week of the latency histogram showing the dependency's p99.9 sitting above the 5s read
  timeout while those slow responses are still useful to the caller — or a timeout-cut count
  that is a non-trivial fraction of traffic rather than a handful of requests. Either
  observation means the aggressive default is cutting off successful work rather than only
  hanging work, and the sequencing was wrong to start aggressive. Equally falsifying and
  cheaper: discovering in the black-hole test that the configured connect timeout does not
  cover DNS or TLS, so the number in config was never the number in effect.
missing_actor: >-
  The team that owns the HTTP endpoint you are calling. They can tell you their own latency
  distribution and whether the operation is idempotent, and they can add an idempotency key or
  a server-side deadline header, which converts your hardest one way door into a dial. The
  problem is framed as a client-side configuration choice, and half the decision lives on the
  other end of the wire.
confidence: medium
