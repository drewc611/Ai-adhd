clusters:
  - id: ship_a_tight_constant_now
    action: "Put a small hard timeout in config today with no retries and no deadline plumbing, and let a named observation decide whether anything more gets built."
    members: [MINIMALIST, DOOR_KEEPER]
    singleton: false
    strongest_objection: "A constant chosen inside one process cannot be right, because the quantity that determines whether a call should still be running is not the client's patience but how much of the caller's patience is left at the moment the call starts, and that number is different on every request. A fixed five or ten seconds is therefore wrong in both directions at once: when the caller has already given up, the remaining seconds are spent holding a socket, a pool slot, a worker and an upstream transaction to produce an answer nobody is left to read, and the bill is paid by every request queued behind it, which is exactly the failure mode that takes a service down at peak rather than the single hang the number was chosen to stop. In the other direction, the first legitimately slow path fails and the observation that proves it — a week of histogram, or an error cluster on one endpoint — only ever reports on the dependency's latency shape, never on the caller's deadline, so no amount of measuring the constant reveals the thing that makes the constant unsound. There is also a party in the path that was not considered: a reverse proxy, load balancer or mesh sidecar typically enforces its own cutoff near sixty seconds with no coordination with this code, so if the chosen number sits above it the config is decoration and the user gets a bare gateway error instead of the handled failure the position promised. Setting one number is cheap precisely because it settles nothing about who owns the end-to-end latency budget, which is the state in which an incident is possible and nobody's fault."
  - id: inherit_and_propagate_a_deadline
    action: "Stop choosing constants and plumb an inherited absolute deadline through the call path, deriving each attempt's timeout from the remaining budget and bounding retries by what is left."
    members: [LEDGER, FRAME_BREAKER, ACTOR_CENSUS]
    singleton: false
    strongest_objection: "This position spends the asker's unbounded wait on a cross-team negotiation it does not control. A propagated budget only exists if something upstream actually sends a deadline and something downstream actually honours cancellation, and neither party has agreed to anything; until both do, the machinery collapses into a constant with extra plumbing around it, except that now there is no bound in place at all while the coordination runs, so the hang that prompted the question survives the entire project. The hard part was never the arithmetic of subtracting elapsed time — it is getting two other teams to ship something, which is the one cost in the plan that cannot be compressed by working harder. Second, deriving the per-attempt number from the dependency's measured p99 encodes that dependency's current shape as a standing contract, and it is unstable in exactly the regime that matters: latency distributions for real services are frequently bimodal rather than fat-tailed, with a small population of legitimately slow calls — a report, a batch, a cold cache — that a p99-derived deadline destroys wholesale rather than at the margin, and the counter that would reveal this requires correlating your cancellations against the dependency's own success logs, which is not an observation the asker can make alone either. Third, the position quietly assumes the asker's service is in the middle of a chain. If it is a single edge hop with one outbound call, there is no budget arriving from anywhere and nothing to divide, and every sentence about hops politely waiting thirty seconds each is describing someone else's system. The cheap version of this whole argument — one hard total deadline in config, shipped this afternoon — captures most of the protection against unbounded waiting, and the remainder is the part that needs the other teams; nothing in the position explains why the cheap part should wait for the expensive part."
