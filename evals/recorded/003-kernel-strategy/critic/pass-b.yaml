problem_hash: sha256:9c7481004ba9e79b453d7ebadec695bf3c037e97d7ba13e325f72a4d897e594b
pass: B
clusters:
  - id: extract_one_then_gate
    action: "Refuse the year-long rewrite, extract a single service behind the existing interface within a quarter without splitting the database, and permit further extractions only if that one measurably relieves a named pain."
    members: [LEDGER, PRIOR_ART, DOOR_KEEPER]
    singleton: false
    strongest_objection: null
  - id: harden_monolith_extract_diverged_seams
    action: "Keep the monolith as the primary deployable, enforce module boundaries mechanically in the build, and extract at most two services this year only along seams whose ownership or deploy cadence has already visibly diverged."
    members: [HORIZON]
    singleton: true
    strongest_objection: "The two extractions are authorised by an already-observed divergence in ownership or deploy cadence, but divergence is not the same as pain that extraction relieves: two modules can deploy on different cadences and still be coupled through the database, so the extraction pays the full per-service tax, admitted here to be roughly a quarter of one team's year, without any measurement showing the pain moved. Nothing in the position requires the first extraction to prove itself before the second is allowed, and nothing requires the pain to be priced before either is started, so the ceiling of two is a guess about this codebase drawn from an imagined future rather than from a number. Worse, the enforced module walls that carry the whole position are acknowledged to slip the moment nobody checks the build rule, and a build rule is exactly the kind of control that gets disabled under deadline pressure, which means the position's own stated failure mode, walls agreed to in a document but not held, is the most probable outcome of following it. A cheaper sequence exists: enforce the walls, run one candidate as a shadow process against the shared database for a release cycle, and let the coupling and deploy-frequency numbers decide whether any extraction, let alone two, is justified."
  - id: fix_named_pain_in_place
    action: "Abandon rewrite planning, spend two weeks writing down three monolith pains with a number on each, and fix the most expensive one inside the current codebase by quarter end, extracting a service only if that fix proves impossible without a process boundary."
    members: [FRAME_BREAKER]
    singleton: true
    strongest_objection: "The three pains a team writes down in a monolith of any age are rarely independent: a ninety-minute flaky deploy, two teams colliding on merges, and a query that pins the primary are usually three symptoms of one coupled module, and the cheapest in-place fix for that shared root cause is precisely the module-boundary enforcement plus a single extraction that this position defers to a later quarter. Treating them as three rows and fixing the top one buys a quarter of symptom relief, then the next row surfaces the same root cause and the structural work starts a quarter late with the same numbers in hand. Separately, the position never answers the question that was asked, so the rewrite proposal returns next quarter with the same backers and the same budget argument, because no decision about architectural direction was recorded; and the two-week numbers exercise is run by the same people who want the year of protected work, who get to choose which numbers are written down and can make the case for extraction out of the very document meant to defuse it."
