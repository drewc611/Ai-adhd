problem_hash: sha256:9c7481004ba9e79b453d7ebadec695bf3c037e97d7ba13e325f72a4d897e594b
frame: FRAME_BREAKER
position: Stop planning any rewrite; instead spend the next two weeks writing down the three specific pains the monolith causes, with a number attached to each, and fix the single most expensive one inside the monolith by the end of the quarter.
reasoning: |
  1. The load bearing assumption is "rewrite." The question treats the problem as one of architecture shape, monolith versus microservices, and treats the remedy as a wholesale replacement with a one year horizon. It assumes the current pain is caused by the monolith being a monolith, rather than by whatever specific thing actually hurts: slow deploys, a tangled module, a database hot spot, a team that cannot ship without stepping on another team. "Rewrite as microservices" bundles a diagnosis and a cure into one word before anyone has stated the symptom.

  2. Whoever benefits from the assumption staying unexamined is whoever gets a year of protected, hard to measure work out of it. That is usually a platform or architecture group that wants a greenfield project, an engineering leader who wants a headline initiative, and vendors or consultants selling the tooling. A rewrite also benefits anyone whose current code is embarrassing, because a rewrite retires it without anyone having to fix it. The people who pay are product teams who get a year of feature freeze, and the people who will be on call for the distributed system afterward.

  3. Once "rewrite" is false, the question is actually: what specifically is slow, fragile, or blocked today, what does it cost per month, and what is the cheapest change that removes that cost. Most of the answers to that question live inside the monolith: a module boundary that needs enforcing, a build that needs to be twenty minutes instead of two hours, a table that needs splitting, a deploy pipeline that needs to be per component instead of all or nothing. Some of those may eventually justify carving out one service. None of them justify deciding on a target architecture for the whole system in advance.

  4. First concrete action, tomorrow: open a document with three rows. Each row is one pain, stated as an observable fact with a number: "deploy takes 90 minutes and fails 1 in 4 times," "checkout and inventory teams block each other on about six merges a week," "the reports query pins the primary database for 40 minutes nightly." Get the people who feel each pain to sign off on the number. By end of week two, pick the row with the highest monthly cost. By end of quarter, ship a fix for it inside the current codebase. Only if that fix is impossible without a process boundary do you extract exactly one service, and you extract it for that reason alone. Repeat. The architecture that results is the one you needed, not the one you guessed at.
forecloses:
  - A planned, scheduled, year long migration program with a target microservices architecture defined up front.
  - Freezing or slowing feature work to fund the rewrite, since the fix work is sized to a quarter and done inside the running system.
  - Treating "monolith" itself as the problem statement; a pain that cannot be written down with a number does not get worked on.
falsifier: If the team tries to write the three pains with numbers and every one of them turns out to be a property of the monolith's shape that cannot be fixed in place, for example separate teams genuinely need different runtimes, scaling profiles, or release cadences and enforcing module boundaries has already been tried and failed, then the correction is wrong and the extraction question was real.
missing_actor: The product owner or business sponsor who funds engineering time, who can refuse to approve any work item that lacks a stated pain and a number, and who can cap architecture work at one quarter per pain.
confidence: high
