problem_hash: sha256:4275fedee633951b897fba88d5494509cc9877b4fec53e74a4bd773dba9d2806
pass: B
clusters:
  - id: measure_the_period_first
    action: "Export the spike timestamps (from the p99 series or, more strictly, from one host's raw request log), compute the true inter-spike interval and its jitter, and let that fingerprint decide whether to grep for an internal timer, a neighbour's cron, an external scheduled actor, or a fill-and-flush accumulator, before profiling, scaling, or tuning anything."
    members: [PARTICULARIST, FRAME_BREAKER, SABOTEUR]
    singleton: false
    strongest_objection: "The fingerprint this position depends on may not be resolvable from the data the asker actually has. A p99 series is computed over an aggregation window, typically one to five minutes, and spike onsets on such a series are smeared by that window; the difference between a constant 40:00, a drifting 38-to-44, and an alternating 40/20 is exactly the difference the window erases, so a day spent building the histogram can return 'somewhere between 35 and 45' and leave the fork unresolved. Meanwhile the discriminator that does survive coarse timing is available in one graph right now: split p99 by instance and see whether every instance spikes in the same bucket or whether one instance spikes per event. That answers shared-versus-in-process without any timing precision, and if it says in-process, the runtime already writes its own pause log and heap sawtooth, which can be lined up against the spikes for free. The word 'or so' also cuts the other way from how it is being read here: a human describing a dashboard says 'or so' whether the period is exact or not, so it is not evidence of jitter, and a genuinely drifting period is also exactly what a capacity-over-fill-rate mechanism inside the process produces, not only a duration timer or a chained job. A position that puts interval measurement ahead of the per-instance split and the pause log risks doing the expensive, low-resolution read before the cheap, high-resolution one."
  - id: read_the_gc_pause_log
    action: "Pull each instance's memory-occupancy curve and stop-the-world pause log and line the pause timestamps up against the p99 spikes, treating the period as a bucket filling at request rate rather than a schedule."
    members: [MECHANIC]
    singleton: true
    strongest_objection: "The entire derivation forks on reading 'or so' as measured drift, but 'or so' from someone who has not yet pulled timestamps is a colloquialism, not data; the asker would say it whether the period is exactly 40:00 or wanders, so the position has committed to 'not a clock' on no evidence either way. That matters because the prior runs the other direction: a collector pause recurring on a 40-minute cadence requires a tenured region that takes 40 minutes of promotion to fill, which in a steady-state API is an unusually large or unusually idle heap, whereas the common producers of multi-minute periodic tail spikes are things with timers or thresholds outside the collector: a connection pool max lifetime set for every connection at boot, a token or cert refresh, a neighbour's cron, a database checkpoint or autovacuum, a client's batch job. By foreclosing the scheduler search and the database as first moves, the position forecloses most of that prior. The pause log is cheap to read and fine as a step, but the position's own falsifier (constant interval at 3 a.m. and at peak, or all instances spiking in the same second) is cheaper still and is readable from the graph the asker already has; that test should be the position, and the pause log the branch taken only if it comes back showing drift and out-of-phase instances."
  - id: fix_user_experience_before_cause
    action: "Sample what affected users do during a spike (succeed, wait, retry, abandon) and make requests resolve within seconds with a result, a visible wait state, or a clean failure, before investigating any cause."
    members: [END_USER]
    singleton: true
    strongest_objection: null
