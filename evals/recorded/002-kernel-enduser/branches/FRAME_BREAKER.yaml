problem_hash: sha256:4275fedee633951b897fba88d5494509cc9877b4fec53e74a4bd773dba9d2806
frame: FRAME_BREAKER
position: Stop inspecting the API and instead pull the exact timestamps of every p99 spike from the last 48 hours, compute the true period and its jitter, and match that number against every scheduled actor that shares the API's hosts, database, or network (cron, backup snapshots, autoscaler, cert and token refresh, log rotation, and your biggest client's batch job), then pause the matching one for two cycles to confirm.
reasoning: |
  1. The load bearing assumption is in "where should I look": it assumes the cause is a place, something inside the API that you find by inspection (a slow endpoint, a lock, a GC, a bad query). A clean 40 minute period with "or so" jitter is not the signature of a place. It is the signature of a clock. Something is running on a timer, and the API is the victim, not the culprit. Nothing in the request path knows what time it is; schedulers do.
  2. The team that owns the API benefits from leaving this unexamined. Looking inside your own code keeps the investigation in territory you control, needs no meeting with the DB team, platform team, or a customer, and lets you file it as "we are profiling." It also flatters the tooling you already bought: APM vendors sell you the ability to look inside the service, not the ability to correlate with someone else's cron.
  3. If the assumption is false, the question is not "what is slow" but "what else happens at 40 minute intervals in this environment, and which of those shares a resource with us." That is a correlation problem, not an inspection problem. The "or so" is the sharpest clue you have: a fixed cron fires at exact wall clock minutes; a job scheduled relative to its own completion, or a client retry/poll loop, drifts. Measure the drift and you can tell which kind of actor you are hunting before you open a single dashboard.
  4. First concrete action: export the p99 series, mark every spike start, and compute the inter spike intervals. If they are exactly 40:00 it is a wall clock cron somewhere; if they wander between 38 and 44 it is a duration timer or a job chained to its own finish. Take that fingerprint and grep every crontab, k8s CronJob, managed service maintenance window (RDS snapshots, Redis BGSAVE, Elasticsearch merges), autoscaler cooldown, certificate and OAuth token TTL, and your top five clients' integration schedules for the same number. Pause the match for two cycles. If the spikes vanish, you are done and never needed a profiler.
forecloses:
  - Starting with a profiler, flame graph, or distributed trace of the request path, since those only show where time is spent inside the API, which is the place the assumption says to look.
  - Adding capacity, autoscaling faster, or tuning GC settings, because a periodic external actor will still land on the same resource regardless of how much of it you have.
falsifier: If the interval between spikes shortens at peak traffic and lengthens overnight (period correlates with request rate), the cause is load driven and internal, and this position is wrong; likewise if the spikes appear in a staging copy with all scheduled jobs disabled and no external clients.
missing_actor: The largest API client, whose batch job or polling loop can run on a 40 minute timer and who can share their schedule or shift it by ten minutes to confirm; also the platform or DBA team that owns the backup and snapshot schedule on the shared database.
confidence: medium
