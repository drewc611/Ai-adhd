problem_hash: sha256:4275fedee633951b897fba88d5494509cc9877b4fec53e74a4bd773dba9d2806
frame: SABOTEUR
position: Pull unaggregated per-request logs from one host for three hours, compute the true spike period from raw timestamps, and break each slow request down by upstream dependency before you open a single crontab or touch a single config.
reasoning: |
  1. The obvious answer is "something runs every 40 minutes, find the scheduled thing": grep crontabs, check GC logs, look at cache TTLs, log rotation, token refresh. It assumes four things about the world: the 40 minute period is real and not an artifact of how the chart is drawn; the periodic thing lives inside your service; the clocks producing your metrics and the clocks running your jobs agree; and there is one cause, not two overlapping ones.

  2. Three ways production violates that.
     First, the metric lies. p99 computed over rolling windows, or percentiles averaged across hosts, or a scrape interval that aliases a shorter job into a longer apparent period. Ten replicas each with a 400 minute event, staggered by deploy time, produce a fleet-wide "every 40 minutes" that no single host exhibits. The chart says 40; nothing in the system is set to 40.
     Second, the period belongs to someone else. A caller with a scheduled batch, a client library with a synchronized token refresh, a connection pool maxLifetime on the caller side that recycles every connection at once and produces a reconnect storm at your edge. Or a dependency: DNS TTL expiry, an upstream whose own cache was populated at its last deploy and expires in lockstep. You can grep your own crontabs forever and never find it.
     Third, the environment lies. Config copied from staging to prod so two schedulers hit the same database; a deploy that populated every cache entry at the same second so they all expire together (a thundering herd that looks periodic because the TTL is periodic); a job pinned to wall time on hosts whose NTP drifted so the spike walks a few seconds each cycle and never lines up with the schedule you are checking against.

  3. Cheapest to cause and most expensive to recover from is the first one, the measurement artifact. It costs one dashboard setting or one aggregation choice, and it costs you weeks: you will tune GC, resize pools, and rewrite a hot path chasing a spike that does not exist at the host level, and every "fix" will appear to half-work because the chart keeps moving. The second one is nearly as expensive but at least it is real.

  4. What survives all three is refusing to reason from the aggregated chart. Take one host, take its raw request log for three hours, list every request over the p99 threshold with its timestamp and its per-upstream timing breakdown. Compute the interval between clusters yourself. If the raw intervals are 40 minutes, the period is real. If the slow requests all wait on the same upstream, the cause is external to your code even if the schedule is yours. If no host shows clusters at all, the chart was lying and you are done. Then, and only then, compare the confirmed period against every lifetime-shaped number you can find, in your service and in the callers and dependencies you can see: pool maxLifetime, token TTL, cache TTL, DNS TTL, cron, GC.
     What it does not survive: a cause inside a caller or dependency whose telemetry you cannot read. You will see that every slow request waited on service X, or that every spike coincides with a burst from client Y, and you will be able to prove correlation and nothing more. If they will not show you their schedule, you are stuck with a hypothesis and a polite email. It also does not survive tail sampling that drops the slow traces before they are written, which is exactly the trace you need.
forecloses:
  - Starting with crontab, GC tuning, or heap sizing before the period is confirmed from raw per-host data.
  - Adding capacity or autoscaling as a first move, since it hides a scheduled cause without finding it.
  - Widening the p99 aggregation window until the spike disappears from the chart.
falsifier: A scheduler listing on the service's own hosts shows a job with an exact 40 minute period whose start times match the spike timestamps to the second, meaning the obvious answer was right and the raw log pull was wasted effort.
missing_actor: The API's callers, who can tell you whether they run a scheduled poll, batch, or token refresh on a 40 minute cycle and can add jitter to it; the problem names only "our API" and assumes the cause is inside it.
confidence: medium
