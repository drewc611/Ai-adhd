problem_hash: sha256:4275fedee633951b897fba88d5494509cc9877b4fec53e74a4bd773dba9d2806
frame: MECHANIC
position: Pull the per-instance memory-occupancy curve and the runtime's stop-the-world pause log for the last several hours and line the pause timestamps up against the p99 spikes, because a period that is "about" 40 minutes is a bucket filling at request rate and emptying in one blocking step, not a clock.
reasoning: |
  1. Components and what each does while the system waits. A request enters through a load balancer that holds the client socket open and runs a health-check timer against each instance. The instance's kernel holds an accept backlog. Inside the process a worker thread (or task) is parked holding: the request's memory, one connection checked out of a pool to the datastore, and possibly a lock or a cache slot. The datastore holds its own buffers and a write log. Nothing in this chain does useful work during a wait; it only holds. If the process itself stops (a runtime pause, a lock held by a housekeeping task), every worker parks at once, the kernel keeps accepting into the backlog, and the load balancer's timer keeps counting.

  2. What is held, consumed, or leaked across the 40-minute interval. Every steady-state service has accumulators that only grow between housekeeping events: memory promoted past the fast young-generation collectors into the region that is collected rarely and with a full stop; entries in a cache aging toward one shared expiry; pooled connections aging toward a maximum lifetime that was set at the same instant for all of them at boot; a write log or memtable on the datastore filling toward its flush threshold. Each of these has a capacity and a fill rate. Interval between events = capacity / net fill rate. The problem says "40 minutes or so", not "every 40 minutes on the dot". A clock produces an exact period. A capacity-over-rate mechanism produces a period that drifts with traffic. That single word "or so" is the first fork in the derivation: the trigger is a threshold, not a schedule.

  3. What happens at each boundary when a component stops responding. When the process pauses to drain the accumulator, in-flight requests simply get older; that is the p99 spike, and it is p99 rather than p50 because the pause is short relative to the aggregation window, so only the slice of requests alive during the pause pays. The load balancer keeps sending until its health check fails; if the pause exceeds that, it pulls the instance and the survivors absorb its traffic, which raises their fill rate and shortens their own period, so the spikes on different instances would start to cluster. Upstream clients whose timeouts are shorter than the pause retry, so a single pause becomes a burst of duplicates landing just after the pause ends, which is a second, smaller spike immediately following the first. Pooled datastore connections sit idle through the pause and are all reused in the same instant afterward, so the datastore sees a burst too. Each boundary converts one stall into an echo on the neighbor.

  4. Where the conventional answer parts company with the mechanism. The usual reply is "look for a scheduled job, then look at dashboards for anything that correlates". That treats 40 minutes as a schedule. The mechanism says a schedule cannot drift, and the reporter says it drifts. So the split happens at the very first step: interpreting the period as a timestamp rather than as a ratio. The second common reply, "add more instances", follows from the same misreading: spreading load lowers each instance's fill rate, which lengthens the period but leaves the height of each pause unchanged, so the spike survives and merely becomes rarer. The mechanism says: find the bucket. The cheapest bucket to read is inside the process itself, because it writes its own sawtooth and its own pause log, and because a process-local bucket fills at a different rate on each instance so its pauses will not line up across instances, which is a discriminating test you can run from one graph.
forecloses:
  - Treating the spike as a scheduled job or cron and searching the job scheduler first.
  - Adding instances or raising client timeouts as the fix; both change the period or hide the tail without touching the pause.
  - Starting the investigation at the database or the network before reading the process's own pause log.
falsifier: The spike interval stays exactly 40 minutes at 3 a.m. and at peak traffic, or every instance spikes at the same second; either one means a clock or a shared upstream, not a per-process bucket.
missing_actor: The operator of the datastore or cache under the API, who can report that store's own flush, checkpoint, or compaction cadence and whether it lines up with the spikes.
confidence: medium
