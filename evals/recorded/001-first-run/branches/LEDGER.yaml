problem_hash: sha256:7e664e715f0b6fb0f409965455dc0e635d68e89b73f8ad68ba977bb7b1f2d394
frame: LEDGER
position: Set a short connect timeout (about 1 to 2 seconds), a per-request total deadline sized to the slowest legitimate response you have actually measured plus a small margin (typically 2 to 5 seconds for an API call), and cap retries at one with jitter, so the bill for a slow dependency is paid by the caller failing fast rather than by the downstream service and its on-call engineer absorbing a pile-up.
reasoning: |
  1. The obvious answer is "generous timeouts so nothing fails spuriously": 30 seconds, or the library default, which is often no timeout at all. Its cost is paid in three currencies by three payers, none of them the asker at the moment of asking. First, threads, sockets, and memory in the asker's own process are held open for the full 30 seconds per stalled call; under a partial outage of the dependency the process exhausts its pool and the asker's service goes down for everyone, not just for the requests that touched the sick dependency. That bill lands on the asker's users, later, at the worst possible time. Second, every retry the client fires on top of a long timeout is a second full-weight request at the downstream service exactly when it is already struggling; the downstream team's on-call engineer pays in sleep and the downstream service pays in compute for work whose result nobody will read. Third, the end user or the calling service upstream waits the full 30 seconds staring at a spinner before learning anything, paying in trust and in their own held resources.
  2. From where the asker stands, only the first cost is even partially visible, and only under load, which is not when they are writing the config. The retry amplification is invisible because it is paid by a different team's pager. The upstream wait is invisible because the asker sees their own latency histogram, not the p99 of whoever is calling them. The socket and memory exhaustion is invisible because it costs nothing in the happy path; defaults look free right up until the incident. A default of "no timeout" is the most expensive option on the ledger precisely because its price shows up as zero in every test.
  3. The cheapest option that still resolves the pain ("what number do I type") is: connect timeout short and fixed (1 to 2 seconds; a TCP handshake that has not completed in that time is talking to a dead or partitioned host and waiting longer buys nothing), read or total deadline set from the measured slow tail of real responses plus a margin rather than from a round number, and a retry budget of at most one retry with jitter, only on idempotent requests, and only when the remaining deadline can afford it. This resolves the pain with no new infrastructure; the only spend is one afternoon looking at the dependency's actual latency distribution.
  4. What it costs instead: some legitimately slow requests will now fail that would have succeeded under a 30 second ceiling. That bill is paid by the small fraction of users on the slow tail, in the currency of a visible error instead of a slow success, and by the asker in the currency of having to handle that error path deliberately. That trade is explicit and it is the right one, because a fast, honest failure is cheaper for everyone downstream and upstream than a slow, silent resource hold, and it is the only option on this ledger where the payer is the party who chose the dependency. Anyone who objects that the tail is too fat is describing a dependency problem, and the timeout is the instrument that makes that problem visible enough to get fixed by the people who own it.
forecloses:
  - Leaving the library default timeout in place, including the common default of no timeout at all.
  - Setting a single generous timeout (30 seconds or more) and relying on aggressive retries to smooth over failures.
  - Choosing the number by intuition or convention rather than from the measured latency distribution of the actual dependency.
falsifier: Pull the dependency's real response latency histogram for the last week; if the p99.9 of legitimate successful responses is well above the proposed total deadline and those slow responses are ones the business needs to succeed rather than fail, the deadline is too tight and this position is wrong for that endpoint.
missing_actor: The team that owns the downstream service being called; they can publish an SLO and a documented per-request time budget, and they can enforce server-side deadlines and load shedding, which is what actually protects them from retry storms regardless of what any single client sets.
confidence: medium
