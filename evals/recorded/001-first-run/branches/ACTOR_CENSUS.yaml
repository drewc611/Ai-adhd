problem_hash: sha256:7e664e715f0b6fb0f409965455dc0e635d68e89b73f8ad68ba977bb7b1f2d394
frame: ACTOR_CENSUS
position: Make every request carry a deadline handed in by the caller and propagated from whoever is waiting on it, and give the client itself only short fixed floors (connect 1-2s, per-read idle 5s, hard total cap 30s) that the caller's deadline can shorten but never lengthen.
reasoning: |
  1. Who can act on this system, and how fast and how cheaply:
     - The developer at the keyboard: edits the timeout constants and redeploys. Minutes to hours, costs a build and a review.
     - The operator on call: changes a config value or feature flag, restarts the process, scales replicas. Seconds if a runtime knob exists, minutes if it needs a rollout. Cheap but needs a pager to fire first.
     - The immediate caller of the client (the code path or handler that invokes it): can retry, can fan out, can cancel, can pass or not pass a deadline. Milliseconds, essentially free, and it acts on every single request.
     - The end user behind that caller (browser, mobile app, CLI user): hits refresh, navigates away, kills the command, gives up. Sub-second, zero cost, no permission needed, and it happens thousands of times a day without anyone logging it.
     - The upstream service and its operator: can hang after accepting the TCP connection, trickle bytes, return a slow 200, deploy something that adds 800ms. Milliseconds to hours, and it is outside our control entirely.
     - The scheduler and infrastructure (kubelet liveness probe, load balancer idle timeout, autoscaler, NAT gateway): can kill the pod, drop the idle connection at 60s, or reap the container mid-request. Seconds, automatic, and it does not care what our timeout says.
     - The attacker: can run a slowloris-style upstream or poison DNS so connects hang, holding our thread pool open for the cost of a few idle sockets. Milliseconds, nearly free.
     - The person who pays: sees the bill for retry storms and stuck threads and cuts the budget or adds a quota. Days, expensive, blunt.
  2. The problem statement names exactly one actor: "I", the developer choosing the numbers, plus a passive "this HTTP client". It leaves out the operator, the caller, the end user, the upstream, the scheduler, the attacker, and the payer. It also frames the client as if it will run unattended with the numbers frozen in, which is the autonomy assumption the frame forbids.
  3. Of the omitted, the fastest and cheapest controller is the end user (or the caller acting on their behalf) abandoning the request. Refresh is instant and free. The attacker is nearly as fast and cheap but only shows up sometimes; the abandoning user shows up on every slow request, all day, in production, and today their signal is thrown away because a fixed-timeout client keeps waiting on an upstream for a response nobody will ever read.
  4. Treating that actor as the primary control changes what "the timeout" even is. The number is not a property of the client; it is a property of who is waiting. So the client's API takes a deadline (a context, cancellation token, or absolute time) on every call, and the caller derives it from what is upstream of them: a browser request that has already burned 700ms of a 2s budget passes the remaining 1.3s; a background job passes a generous 30s; a health check passes 500ms. When the user cancels, the caller cancels, and the client aborts the socket immediately instead of finishing a doomed read. The client keeps a small set of fixed floors that exist to defend the process from the actors who cannot be trusted with the deadline: a connect timeout of 1-2s (a healthy peer on the same network answers in tens of milliseconds; anything longer is a dead host, a blackholed route, or an attacker), a per-read idle timeout of about 5s (guards against a peer that accepted the connection and then trickles), and a hard total cap of 30s that stays below the load balancer and liveness probe cutoffs so the scheduler never has to be the one to end the request. Those floors are also exposed as runtime config so the operator can tighten them in seconds during an incident without a redeploy. The developer's job shrinks from picking the right numbers to picking the floors and making it impossible to call the client without a deadline.
forecloses:
  - A single global timeout constant (or the library's default, which is often infinite) compiled into the client and shared by every call site regardless of who is waiting.
  - Tuning the timeout purely to the upstream's observed p99 latency, which treats the upstream as the only actor and ignores that the person waiting may have already left.
  - Letting the load balancer, liveness probe, or thread-pool exhaustion be the mechanism that eventually ends a stuck request.
falsifier: Instrument the caller side and observe that over a week no request was ever cancelled or abandoned before completion (for example, the only caller is an unattended batch job with no human or upstream deadline); then the caller-deadline plumbing buys nothing and fixed floors tuned to the upstream's p99 are the correct and simpler answer.
missing_actor: The end user (or the caller on their behalf) who abandons the request by hitting refresh, navigating away, or killing the process; the action is cancellation, and the client should honor it immediately rather than continue waiting on the upstream.
confidence: medium
