problem_hash: sha256:7e664e715f0b6fb0f409965455dc0e635d68e89b73f8ad68ba977bb7b1f2d394
pass: B
clusters:
  - id: caller_owned_deadline
    action: Change the client's call interface so every request carries a deadline supplied by the caller from its own remaining budget, keep only short fixed floors (connect, idle, hard cap) on the client as backstops, and remove the ability to call without a deadline.
    members: [ACTOR_CENSUS, FRAME_BREAKER]
    singleton: false
    strongest_objection: "Requiring a deadline at every call site is the most expensive and least reversible move on the table, and neither member prices it. It changes the signature of every caller, and most callers today do not know their budget; in practice they will pass a made-up constant, which reproduces the global timeout in N places with worse observability and no single knob for the on-call operator to turn. The floors the branches keep (connect 1-2s, idle 5s, cap 30s) are exactly the unmeasured static numbers the position claims to have dissolved, so the asker still has to pick numbers, now with an API migration in front of them. The falsifier (no cancellations observed for a week) can only be checked after building the caller-side instrumentation the position presumes, so the cheap test comes after the expensive commitment. DOOR_KEEPER reaches the same per-call override as an optional door closed at zero cost today, while shipping a working default in an afternoon; the asker asked what numbers to set, and this cluster answers a question about architecture that may be right but does not need to be answered before the process stops hanging."
  - id: semantics_first_generous_default
    action: Enforce total-deadline semantics, forbid infinite waits, expose a per-call override, keep retries inside the deadline, then ship connect 2s and total 10s behind config and tighten per endpoint to 2-3x observed p99 after a week of elapsed-time logging.
    members: [DOOR_KEEPER]
    singleton: true
    strongest_objection: "By its own argument the 10s default is not a two-way door. The branch states that whatever number ships first gets copied into other services' budgets and runbooks, and then ships 10s to every call site as the inherited default, so a week later the tightening it promises is fighting callers who have already sized to 10s. The tuning step also treats the upstream's p99 as the authority on how long to wait, which ACTOR_CENSUS forecloses directly: the party whose time is actually being spent is whoever is waiting on the caller, and a browser request with 1.3s left gains nothing from a deadline that is 2.5x some server's p99. The 2x-3x multiplier is an unjustified constant dressed as a derivation, and a week of logging is the slowest of the experiments proposed while being the only one that produces the number. MINIMALIST's point also lands: the four semantic commitments are sound but the asker cannot tell from this branch which of them is needed today versus which is design hygiene, so the answer to 'what number' arrives wrapped in an API review."
  - id: measured_tight_static
    action: Read the dependency's existing latency histogram, set connect to 1-2s and a total deadline just above the measured slow tail (typically 2-5s), and permit at most one jittered retry on idempotent calls inside the remaining deadline.
    members: [LEDGER]
    singleton: true
    strongest_objection: null
  - id: single_generous_deadline
    action: Set one client-wide total request deadline of 10 seconds and change nothing else until a production timeout error provides evidence for finer settings.
    members: [MINIMALIST]
    singleton: true
    strongest_objection: null
