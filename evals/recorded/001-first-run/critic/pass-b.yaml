    T2: { fired: true, evidence: "The load bearing assumption is that the timeout is a property of the client set once by the developer; LEDGER accepts it wholesale and only argues about which static number and who pays for it." }
    T3: { fired: false, evidence: "No citations or authorities appear; the who-pays ledger is argued from first principles." }
    T4: { fired: false, evidence: "It closes three decisions (connect value, deadline source, retry count) and deliberately leaves the total deadline value to a measurement the reader performs, so it does not pretend to have settled everything." }
    T5: { fired: false, evidence: "Position is an imperative: set connect 1-2s, set total from measured tail, cap retries at one." }
    T6: { fired: false, evidence: "Names the asker's users, the downstream team and its on-call, the upstream caller/end user, and the downstream service; omits operator, scheduler, and attacker but the named set covers the decision." }
    T7: { fired: true, evidence: "Every recommendation is presented at equal weight with no statement of what it costs to be wrong about connect vs total vs retry or how long until you learn; 'one afternoon of measurement' is a cost estimate, not a reversibility distinction." }
    T8: { fired: false, evidence: "Flat restatement 'short connect, total slightly above measured tail, one jittered retry' is the same claim and still worth saying without the ledger framing." }
  MINIMALIST:
    T1: { fired: true, evidence: "The branch itself states connect vs read distinction 'buys nothing' and gives a single wall-clock deadline; delete 'HTTP' and 'this client' and the answer 'one 10s total deadline' is unchanged for any blocking call." }
    T2: { fired: true, evidence: "It accepts that the timeout lives on the client and is picked once by the developer, and explicitly labels per-call and per-route considerations 'imagined pain' rather than testing them." }
    T3: { fired: false, evidence: "No citations; the argument is the pain-first smallest-intervention chain." }
    T4: { fired: false, evidence: "It forces one decision and explicitly lists what it leaves unfixed, the opposite of a completeness claim." }
    T5: { fired: false, evidence: "'Set a single overall request deadline of 10 seconds and change nothing else' is a do-X sentence." }
    T6: { fired: true, evidence: "Only the asker and the upstream owner are named; the caller who inherits 10s, the end user waiting on it, the operator who needs a knob during an incident, the scheduler, and the attacker are all absent, and the caller in particular decides whether 10s is generous or fatal." }
    T7: { fired: false, evidence: "It orders explicitly: the cheap one-number move first, per-endpoint splitting only after a production error provides evidence, and states the cost of being wrong (a 12s success cut at 10s)." }
    T8: { fired: false, evidence: "Stripped of the minimalist framing, 'set a 10s total deadline' is a concrete claim the asker can act on." }
