    T3: { fired: false, evidence: "No authorities cited." }
    T4: { fired: false, evidence: "It forces four semantic decisions and two numbers today and explicitly defers per-endpoint values to a week of data, so the reader retains a decision." }
    T5: { fired: false, evidence: "'Set connect timeout to 2s, per-request total deadline to 10s' is a do-X sentence." }
    T6: { fired: false, evidence: "Names the developer, the upstream owner, other services and their callers who inherit the number, and operations via runbooks and pagers; omits the end user and attacker but the slowloris case covers the hostile peer." }
    T7: { fired: false, evidence: "The entire structure is reversibility: two-way numbers vs one-way semantics, with cost of being wrong and detection latency stated for each door." }
    T8: { fired: false, evidence: "Flat restatement 'total deadline not read timeout, no infinite, per-call override, retries inside deadline, 2s/10s defaults, tune later' is the same claim." }
  ACTOR_CENSUS:
    T1: { fired: false, evidence: "The load balancer idle cutoff, liveness probe, per-read idle floor for trickling peers, and DNS-poisoning connect hang are HTTP and infrastructure specific and set the floors." }
    T2: { fired: false, evidence: "It names the assumption that the client runs unattended with one developer-chosen number frozen in, tests it by enumerating actors, and the deadline-propagation position follows." }
    T3: { fired: false, evidence: "No citations." }
    T4: { fired: false, evidence: "The actor list is long but the position commits to one design plus three floors and leaves each caller's budget to the caller by design, not by omission." }
    T5: { fired: false, evidence: "'Make every request carry a deadline handed in by the caller' is a do-X sentence." }
    T6: { fired: false, evidence: "Names all seven detector actors (user, operator, caller, upstream, attacker, scheduler, payer) and builds on the end user." }
    T7: { fired: false, evidence: "Distinguishes the operator's runtime knob (seconds, no redeploy) from the developer's constant edit, and reserves runtime-configurable floors for that reason, though it does not price the irreversibility of the signature change." }
    T8: { fired: false, evidence: "Stripped of the census, 'callers pass deadlines, client keeps short defensive floors' is the claim and stands." }
  FRAME_BREAKER:
    T1: { fired: false, evidence: "Marginal: the position generalizes to any RPC client, but the connect-timeout backstop and the 503 Retry-After actor action are HTTP-specific, and the batch-vs-request-SLO example depends on there being multiple callers of one client." }
    T2: { fired: false, evidence: "Names 'on this HTTP client' as the load bearing assumption, tests it with the one-client-two-correct-answers case, and derives the position from the result." }
    T3: { fired: false, evidence: "No citations." }
    T4: { fired: false, evidence: "It forces one decision (delete the client-wide field) and hands the reader an enumeration task rather than pretending every budget is known." }
    T5: { fired: false, evidence: "'Stop configuring a timeout on the client at all; pass a per-call deadline' is a do-X sentence." }
    T6: { fired: false, evidence: "Names the caller, the upstream owner, the client library author, and the end user via the user-facing SLO; omits operator, scheduler, and attacker." }
    T7: { fired: false, evidence: "Marginal: it sequences the cheap enumeration of call sites before the committed signature change, but never states what deleting the client-wide field costs if wrong or how you would learn." }
    T8: { fired: false, evidence: "Flat restatement 'pass per-call deadlines instead of a client timeout' is still a substantive claim without the who-benefits framing." }
