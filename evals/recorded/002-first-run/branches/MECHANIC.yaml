problem_hash: sha256:4275fedee633951b897fba88d5494509cc9877b4fec53e74a4bd773dba9d2806
frame: MECHANIC
position: Overlay the spike timestamps on the API process's heap-in-use curve and the datastore's checkpoint/compaction log, and treat whichever sawtooth resets at the moment of the spike as the cause, because "about 40 minutes" is the period of a buffer filling and draining, not a clock.
reasoning: |
  1. Components and what they do while waiting. A request enters a listener socket, is handed to a worker thread or event loop, borrows a connection from a pool, waits on a datastore, and returns. While it waits, the worker is parked, the pooled connection is held open, and the request's allocations sit on the heap. The datastore side meanwhile accepts writes into an in-memory buffer or write-ahead log and periodically has to make that durable in bulk. The runtime meanwhile lets garbage accumulate until a threshold forces a collection. Every one of these is a container with a fill rate and a capacity.

  2. What is held, consumed, or leaked over the interval. Over forty minutes of traffic the heap fills with short-lived objects that survive into an older generation; the write buffer or memtable fills toward its flush size; log segments grow toward rotation size; a pool whose connections have a maximum lifetime approaches the moment they all expire together because they were all opened together at startup. Each of these is a stock that grows monotonically and is released all at once. A release-all-at-once event is exactly the shape of a p99 spike: median unaffected, tail destroyed for a few seconds.

  3. What happens at each boundary when a component stops responding. When the runtime pauses to collect the old generation, every worker is frozen, sockets keep accepting, and a queue forms in the kernel; the requests at the back of that queue become the p99. When the datastore flushes or compacts, it saturates its own disk, the API's pooled connections all wait simultaneously, the pool empties, new requests block on pool acquisition, and the same queue forms one hop upstream. When a pool's connections all hit max-lifetime at once, every request in that instant pays a reconnect handshake. In each case the boundary does not fail; it stalls, and the stall is shared across all in-flight requests because the stalled resource is shared. That shared stall is why the symptom is periodic and tail-only rather than random and everywhere.

  The key discriminator is the phrase "or so". A scheduled job runs on a wall clock and lands on round boundaries: every thirty minutes, on the hour. A mechanism that fires when a stock reaches capacity has a period equal to capacity divided by fill rate, and fill rate is traffic, so the period drifts: shorter under load, longer at night. Forty minutes is not a number anyone types into a schedule; it is a number a buffer produces. So the first act is not to hunt for a job but to find the sawtooth: a metric that climbs steadily and drops to a floor at exactly the spike time. Heap-in-use, memtable size, WAL bytes since last checkpoint, and pool connection age are the four sawtooths that exist in almost every such system. Whichever one resets at the spike is the mechanism. Then reduce the amplitude of that flush by making it smaller and more frequent, or by moving it off the request path.

  4. Where the conventional answer parts company with the mechanism. The usual reflex is "check the cron jobs" and, failing that, "add more instances". The first parts from the mechanism at the moment the period is observed to drift, because a clock does not drift with traffic. The second parts from it at the point where each instance still fills and flushes its own buffer; more instances make the flushes smaller per instance and more frequent in aggregate, but each request that lands on a flushing instance still pays the full stall, so the tail does not move. Capacity treats the spike as a load problem. The mechanism says it is a batching problem, and the fix is in batch size, not fleet size.
forecloses:
  - Scaling out or adding replicas as the first move; per-instance fill-and-flush is unchanged by fleet size.
  - Investigating scheduled jobs, cron, or timer-driven tasks first; a wall-clock trigger does not produce a period of "about forty minutes".
  - Tuning client timeouts or retry policy; those shape how the stall is felt, not whether it happens.
falsifier: Measure the spike period at peak traffic and at the quietest hour. If it is the same to the second in both, the trigger is a clock, not a filling buffer, and this position is wrong. Equally, if no monotonic metric (heap, WAL bytes, memtable size, connection age) resets within a few seconds of the spike, the fill-and-drain explanation is falsified.
missing_actor: The operator of the datastore or runtime configuration, who can lower the checkpoint or compaction size threshold, cap the young-to-old promotion rate, or stagger connection max-lifetimes with jitter so the drain happens in many small steps rather than one large one.
confidence: medium
