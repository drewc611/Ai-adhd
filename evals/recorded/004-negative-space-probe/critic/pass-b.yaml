    T3: { fired: false, evidence: "The argument about who reads flag state and what changes for them cites no outside authority anywhere, so removing citations removes nothing." }
    T4: { fired: true, evidence: "The position offers two live mechanisms (a versioned boolean like checkout_v2 or a full multivariate legacy|v2 flag) without settling which to build, leaving that decision to the reader." }
    T5: { fired: false, evidence: "The position opens with an imperative, 'Name the flag by version or variant... use something like checkout_v2', which is an actionable do-X sentence." }
    T6: { fired: false, evidence: "missing_actor names the experimentation/data-science owner with a concrete action (decide boolean vs multivariate), and the reasoning also discusses on-call engineers and analytics pipelines as affected readers." }
    T7: { fired: true, evidence: "The position never weighs what it costs to pick the wrong flag shape against how long that mistake would take to surface, e.g. whether upgrading boolean to multivariate later is cheap or a painful migration." }
    T8: { fired: false, evidence: "Stripped of framing, 'use a versioned or multivariate name instead of a relative boolean so exposure and control-group data stay distinguishable' is a real, checkable analytics-engineering claim." }
