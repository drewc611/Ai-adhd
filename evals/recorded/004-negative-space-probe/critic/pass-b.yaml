problem_hash: sha256:3ba15a84863bec4bc8a20ff80de8d21d16c48f123fe67df8451ab32bdcf60102
pass: B
clusters:
  - id: version_variant_naming
    action: "Rename the flag using a version or variant tag such as checkout_v2, or a multivariate legacy|v2 state, instead of any name built on the word new."
    members: [NEGATIVE_SPACE]
    singleton: true
    strongest_objection: null
  - id: literal_adhoc_naming
    action: "Pick one specific, literal name for this flag right now without pausing to design or adopt any broader naming convention."
    members: [MINIMALIST]
    singleton: true
    strongest_objection: null
  - id: session_sticky_flag
    action: "Make the flag's evaluation sticky for the whole duration of a shopper's checkout session, leaving the actual name of the flag unresolved."
    members: [SUPPLICANT]
    singleton: true
    strongest_objection: null
  - id: convention_matched_naming
    action: "Copy the casing and namespace pattern the team's existing flags already use, keeping the word new as part of the literal string."
    members: [PARTICULARIST]
    singleton: true
    strongest_objection: null
  - id: capability_based_naming
    action: "Name the flag after the permanent capability it gates, with a domain prefix, and never after its relative recency."
    members: [CARETAKER]
    singleton: true
    strongest_objection: "This position requires knowing, at flag-creation time, the precise and durable shape of the capability the redesign will end up being -- but checkout redesigns routinely change scope between when the flag is created and when the feature actually stabilizes, so a name like a single-page-flow identifier can just as easily become inaccurate as a temporal one would, only for a different reason (the implementation changed) rather than the reason this position defends against (time passed). Locking in a specific mechanism name early is itself a bet that the mechanism won't change, and if it does, the same downstream migration cost this position is trying to avoid gets paid anyway, just earlier and under a different justification."
  - id: registry_governance_gate
    action: "Require the flag to be registered with an owner and a hard expiry date before the PR introducing it can merge, treating the literal name as secondary."
    members: [FRAME_BREAKER]
    singleton: true
    strongest_objection: null
traps:
