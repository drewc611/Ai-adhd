pass: B
clusters:
  - id: deadline_propagation
    action: "Thread an explicit end-to-end deadline from the request entry point through every outbound call, derive each call's timeout from the time remaining, spend retries out of that same budget, and keep only a few fixed ceilings."
    members: [LEDGER, ACTOR_CENSUS, FRAME_BREAKER]
    singleton: false
    strongest_objection: null
  - id: bounded_defaults_then_measure
    action: "Put conservative connect, read and total values into hot-reloadable config today, add a latency histogram and per-timeout counters for a week, then tighten from the measured tail, and leave retry-on-timeout off until idempotency keys exist."
    members: [DOOR_KEEPER]
    singleton: true
    strongest_objection: "The week of measurement is aimed at the wrong variable. A histogram of this dependency tells you how long it takes to answer; it cannot tell you how long the answer is still worth having, and that second quantity is the one that decides the number. The plan concedes as much by requiring the total to sit under the caller's deadline, but that deadline is asserted as a side constraint and never obtained, derived, or carried anywhere, so the central input is the one thing nobody measures during the week. Sizing from p99.9 plus headroom then optimizes for the dependency's convenience rather than the patience being spent, and it fails in the case that actually causes outages: two or three such calls stacked inside one inbound request, each comfortably inside its own configured limit while the request as a whole blows past anything the waiting party would tolerate. A static per-call number cannot see that composition no matter how good the histogram is. There is also a self-inflicted cost in the sequencing: the caller's tolerance is usually knowable today from what the product already promises, at no instrumentation cost, so a week of waiting buys data about the dependency while the cheaper and more decisive input sits unused. The reversibility analysis is real and the retry gate on idempotency keys is right, but neither requires deferring the number, and a conservative static ceiling shipped now hardens into the permanent answer precisely because it stops the bleeding well enough that nobody returns for step three."
  - id: single_total_timeout
    action: "Set one total request timeout, generously sized from the worst response you have seen, and change nothing else until it misfires."
    members: [MINIMALIST]
    singleton: true
    strongest_objection: null
