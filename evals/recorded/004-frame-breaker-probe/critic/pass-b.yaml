    T3: { fired: false, evidence: "No authority is cited; the minimal-intervention argument is self-contained from premise to action." }
    T4: { fired: false, evidence: "It explicitly forecloses designing a naming taxonomy and forecloses setting up a registry or lifecycle policy before there is more than one flag." }
    T5: { fired: false, evidence: "The position states 'Name it literally what it does, right now, with no scheme ... and stop there,' a direct do-X imperative." }
    T6: { fired: true, evidence: "The named actor (whoever eventually deletes the flag) is given no concrete action now beyond a hope that the chosen name will 'make it obvious' later, which is not an action they can take." }
    T7: { fired: true, evidence: "Nothing weighs the cost of a bad literal name against how long it would take to notice, despite the whole argument resting on this being a low-stakes, reversible choice." }
