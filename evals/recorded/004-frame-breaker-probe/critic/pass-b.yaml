problem_hash: sha256:3ba15a84863bec4bc8a20ff80de8d21d16c48f123fe67df8451ab32bdcf60102
pass: B
clusters:
  - id: gate_naming_on_lifecycle
    action: "Withhold the actual name until the flag's temporary-vs-permanent or owner/rollback/removal status is established, and let that status determine or accompany the name."
    members: [PARTICULARIST, FRAME_BREAKER]
    singleton: false
    strongest_objection: "The temporary-versus-permanent split this rests on assumes those are two clean, discoverable, static states, but flags routinely begin with an intended rollout window and then become permanent through sheer inertia -- nobody files a ticket to declare it permanent, people just stop paying attention to it. The investigation this position calls for can return a confident 'temporary' verdict today that quietly becomes false in six months with no renaming trigger, leaving the codebase with exactly the misleading relative name this position set out to prevent, while having spent effort on a classification step that didn't hold."
  - id: rename_to_versioned_key_now
    action: "Immediately rename the flag to a versioned, capability-based key and migrate every downstream consumer today."
    members: [SUCCESSOR]
    singleton: true
    strongest_objection: "This treats the flag as already carrying two years of entangled downstream dependents -- analytics schemas, mobile builds, merchant contracts -- but nothing established that any of that has actually accumulated yet; if the flag is being named at or near creation, the full migration burden is being paid against a hypothetical future rather than anything that exists today, and the cost of over-engineering a versioned key and deprecation window for a flag that never grows those dependents is never weighed against simply renaming later if and when a real second consumer shows up."
  - id: pick_literal_name_now
    action: "Assign a plain literal descriptive name to the flag immediately and treat the decision as closed."
    members: [MINIMALIST]
    singleton: true
    strongest_objection: null
  - id: surface_version_to_users
    action: "Skip optimizing the internal flag name and instead build a way for the checkout version to be visible to users and support on the error screen or receipt."
    members: [SUPPLICANT]
    singleton: true
    strongest_objection: null
traps:
