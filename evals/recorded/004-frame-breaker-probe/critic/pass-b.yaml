    T3: { fired: false, evidence: "No citations appear; the argument runs entirely from the problem's wording to a conditional naming rule." }
    T4: { fired: false, evidence: "It forecloses three concrete moves: naming 'new_checkout' permanently, naming before checking lifecycle, and using a generic convention without checking the existing flag system." }
    T5: { fired: false, evidence: "It contains direct imperatives -- 'name it for deletion', 'name it after the actual checkout capability' -- gated by a condition, not absent." }
    T6: { fired: false, evidence: "The missing_actor (the flag-platform team) is named with a concrete action: specifying the exact naming scheme before any name is chosen." }
    T7: { fired: false, evidence: "It explicitly reasons that a temporary flag's wrong name costs little because it disappears before misleading anyone, while a permanent flag's wrong name costs a lot because it will 'actively mislead anyone reading it later' -- a cost-and-time argument." }
