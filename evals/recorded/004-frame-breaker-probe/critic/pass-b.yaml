    T6: { fired: false, evidence: "The missing_actor (the platform/on-call engineer) is named with a concrete gatekeeping action -- requiring an owner and expiry field before flag creation." }
    T7: { fired: true, evidence: "It never weighs the cost of being wrong about skipping governance against the cost of the real sprint-time commitment it proposes, nor how long either failure would take to surface." }
