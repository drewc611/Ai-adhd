    T4: { fired: false, evidence: "It forecloses at least two live options (leaving the name as-is, and repeating the temporal pattern on the next redesign) and forces a convention plus an ownership decision now." }
    T5: { fired: false, evidence: "The position opens with the imperative 'Rename the flag now ... and pay the migration cost ... today', an explicit do-X sentence." }
    T6: { fired: false, evidence: "The missing_actor (the analytics/data team) is named with a concrete decoupling action that the rename's safety depends on." }
    T7: { fired: false, evidence: "It explicitly separates what's cheap to decide now (naming convention, retirement owner) from what's expensive to leave open (letting the string become infrastructure) and refuses to pre-commit to future version names." }
    T8: { fired: false, evidence: "Restated flatly -- migrate off the temporal flag name now while the cost is still low -- it remains a real, arguable engineering claim, not a claim that depended on its framing." }
