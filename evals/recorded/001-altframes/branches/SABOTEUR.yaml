problem_hash: sha256:7e664e715f0b6fb0f409965455dc0e635d68e89b73f8ad68ba977bb7b1f2d394
frame: SABOTEUR
position: Propagate a deadline from the caller and derive every timeout from what remains of it — roughly 1s connect, pool checkout charged against the same budget, a body-idle cap plus a hard total-request ceiling, all measured on a monotonic clock — and gate retries on remaining budget plus a 10 percent retry budget instead of a per-call attempt count.
reasoning: |
  1. The obvious answer is a constant. "Give it 30 seconds," set once in the client config,
  the same number in every environment and at every call site. It assumes a world where a
  dependency is either up or down, where one number can stand for connect, handshake, first
  byte, and whole response, where the clock is trustworthy, where nobody upstream is waiting
  on a shorter deadline than yours, and where "timeout" in your client library means what you
  think it means. That last assumption is already false in most libraries before anything in
  production goes wrong. Many clients' timeout option covers only socket inactivity, not total
  request duration, and almost none of them start the clock when you queue for a connection
  from the pool.

  2. Three ways the world violates it.

  (a) The dependency that lies rather than fails. The server accepts your connection, completes
  the handshake, returns 200 with headers, and then dribbles the body one chunk every few
  seconds — a stuck backend behind a streaming proxy, or a paginating endpoint whose store went
  slow mid-scan. An idle or read timeout resets on every byte received, so a 30 second read
  timeout never fires. The request is held open for an hour. Your health checks are green,
  your error rate is zero, and your connection pool is gone.

  (b) Retry amplification across layers. Your 30 second timeout sits under three attempts in the
  client, inside a caller that itself retries three times, behind an edge that retries once. A
  dependency that gets twice as slow now receives many times its normal load exactly when it can
  least serve it, and every one of those requests is still executing server-side after the client
  that asked for it has already given up and returned an error. The extra load keeps the
  dependency slow, which triggers more retries. This is metastable: the system stays down after
  the original cause is gone.

  (c) The config that travels and the clock that jumps. The 30 seconds was tuned against a
  service in the same rack. It gets copied into the cross-region deployment where p99 is already
  8 seconds, or into a batch worker where it is now the only thing preventing an infinite hang.
  Alongside that, the timeout is often measured against wall clock: an NTP step, a VM
  suspend and resume, or a container migration makes the deadline fire immediately or never.

  3. (b) is the cheapest to cause and the most expensive to recover from. Causing it takes no
  deploy, no attacker, and no bug — one dependency gets slower and the system does the rest to
  itself. (a) needs a specific misbehaving server. (c) needs a human to move a file. But
  recovering from (b) means recovering from a loop that no longer needs its trigger: removing
  the original slowdown does not restore service, because the retries are now the load. You
  have to shed traffic and coordinate a change across every independently configured layer that
  is retrying, usually during the incident, usually without knowing how many layers there are.
  (a) is fixed by restarting a process. (c) is fixed by a revert.

  4. What survives all three is a deadline instead of a constant. The caller states when the
  answer stops being useful, that deadline travels with the request, and each hop spends from
  what is left rather than starting a fresh clock. Concretely: connect and handshake get a small
  fixed ceiling, around a second, because a healthy TCP and TLS setup is milliseconds and a slow
  one is a dead host; waiting for a free connection from the pool is charged against the budget,
  not free; the body gets both an inactivity cap and a hard total ceiling, so the dribbling
  server in (a) is cut off; every measurement uses a monotonic clock, so (c) cannot skew it; and
  a retry is attempted only when the remaining budget exceeds the observed p99 of the call, with
  retries capped as a fraction of total traffic — a budget, not a count — so (b) cannot amplify:
  when the dependency degrades, the budget is exhausted and retries stop by themselves. Timeouts
  become derived values, and a copied config in the wrong environment fails visibly and
  immediately rather than silently.

  What it does not survive is the dependency that is fast and wrong. A server that returns 200
  in 40 milliseconds with a stale, empty, or fabricated body defeats every timeout in this
  design; no deadline discipline detects it, and it needs response validation and staleness
  checks that are a different mechanism entirely. It also does not survive the first hop, where
  there is no upstream deadline to inherit — a browser, a mobile app, or a third-party caller
  gives you nothing, so someone must invent a number at the edge, and that number will
  occasionally cut off a request that would legitimately have succeeded.
forecloses:
  - A single tunable timeout constant shared across environments and call sites. Under this position there is no "the timeout" to raise when someone complains, and the config surface that operators are used to editing stops existing.
  - Fixed per-call retry counts such as maxRetries=3 with exponential backoff, and retrying at more than one layer of the stack. Retries become conditional on budget, and layers below the deadline owner must stop retrying entirely.
  - Relying on the client library's default read or idle timeout as the bound on request duration, which is what most services do today.
  - Long-running synchronous requests. Any operation that cannot finish inside an edge deadline must be restructured as an async job with an id to poll, rather than granted a longer timeout.
falsifier: Add one counter to the client — requests the caller abandoned as timed out whose server-side handler nevertheless ran to completion — and one gauge for in-flight concurrency against the dependency. During the next real degradation, if that counter stays near zero and in-flight concurrency stays flat while a flat constant timeout is in force, then retry amplification and orphaned work are not happening here, the expensive attack is imaginary, and a single constant is the right answer.
missing_actor: The operator of the intermediary — the load balancer, ingress, API gateway, or service mesh sidecar sitting between this client and the server. It enforces its own idle and request timeouts, commonly 60 seconds at an ELB and 15 at an ingress, which silently cap or preempt whatever the client sets, and it can reset a connection the client believes is healthy. A platform team who has never heard of this service can change those numbers at any time, so any deadline scheme that is not also asserted at that layer is advisory only.
confidence: medium
