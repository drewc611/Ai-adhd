clusters:
  - id: propagated_deadline_budget
    action: "Stop treating the timeout as a constant on the client and instead stamp a deadline where the request enters, carry the remaining budget to every outbound call, and compute each attempt's timeout by subtraction, keeping static values only as ceilings or unclaimed-case defaults."
    members: [FRAME_BREAKER, ACTOR_CENSUS, LEDGER]
    singleton: false
    strongest_objection: "The mechanism is justified almost entirely by a failure mode nobody here has reported observing, and it is bought with a refactor that spans call signatures, entry points and at least one other team's roadmap. Meanwhile the likeliest state of the client on the day this question was asked is that it has no bound at all, and every week spent threading a budget through the call graph is a week in which the process can still park a thread on a socket that never answers. That ordering is backwards: a crude outer bound is minutes of work and removes the only genuinely unbounded failure, while the budget removes a second-order failure - spending time on a result nobody can still receive - that costs capacity rather than availability. Worse, the benefit most often claimed for propagation is not the asker's to collect. A deadline carried in a header does nothing unless the server on the other end reads it, cancels, and sheds; if it does not, the client abandons the request and the server keeps burning capacity on it exactly as before, so the expensive half of the work buys a header nobody honors. And the subtraction only yields a number when something upstream has a deadline to subtract from - for a cron, a batch job, or any entry point where no one is waiting, the entire derivation returns nothing and the asker is back to choosing a constant, which is what they asked about in the first place."
  - id: single_outer_bound
    action: "Add one total-request deadline of ten seconds to the client and make no other change."
    members: [MINIMALIST]
    singleton: true
    strongest_objection: "The number is defended on evidence the same answer says the asker does not have. Calling ten seconds comfortably above any healthy response this client has ever produced is a claim about a latency distribution, and if the p99 of even one endpoint behind this client already sits above the bound, the change converts working requests into errors on the morning it ships - an availability regression introduced by a reliability fix, which is the worst possible trade for a one-line change. Two further conditions turn the single bound from harmless into harmful, and both are common enough that assuming their absence is not conservative. If any retry wrapper already sits around this call, one bound becomes that bound times the attempt count and the worst case gets longer, not shorter. If the bound is implemented as an idle timer rather than a wall-clock deadline, a server that trickles one byte at a time holds the connection and the pool slot forever, which is the precise failure the change was meant to eliminate. A single number is also blind to the cheapest distinction available for free: a connection to a host that is gone fails in well under a second, so folding connect into the total means paying the full budget to learn something the network already knew immediately. Finally, bounding the client does not stop the work - the server continues executing a request nobody will read - so the resource the answer claims to protect is only half protected."
  - id: sequence_by_door_cost
    action: "Ship four conservative static values with retries off today alongside latency and pool-saturation instrumentation, spend a week measuring the distribution, then take the irreversible steps in a fixed order: deadline threading, idempotency keys, one budgeted retry, and only then any externally published number."
    members: [DOOR_KEEPER]
    singleton: true
    strongest_objection: "The position breaks its own rule on the day it ships. It says a timeout is a claim about a latency distribution you must go measure and that copying a number from taste or a default is ruled out, then opens by prescribing three numbers chosen from exactly that taste - and those numbers, not the sequencing argument, are what the asker will actually paste into the config and never revisit once the pain is gone. The rest of the plan is a bet that the expensive structural work is cheaper than the failures it prevents, but the evidence offered for those failures is their long detection latency, which is another way of saying none of them has been observed here. Idempotency keys on every non-GET call are the clearest case: that is a wire-format and server-side storage commitment requiring another team's agreement, demanded before any evidence exists that this client ever retries, in service of a retry that the same answer refuses to enable. Holding retries back for a quarter also has a cost that goes unpriced - a single transient failure that one immediate retry would have absorbed now surfaces to the user as an error, and for an idempotent read, which is most HTTP traffic, the duplicate-side-effect argument does not apply at all. A plan that sequences by what cannot be undone should notice that the cheapest reversible move of all, one retry on a GET, was ruled out by an argument that only holds for writes."
