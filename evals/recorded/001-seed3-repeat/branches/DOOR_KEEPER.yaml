  structural work I front-loaded is not buying what I claimed.
missing_actor: >-
  The team that owns the service on the other end of this client. They hold the server-side
  timeout, the load shedding, and the idempotency-key storage, and if their server timeout is
  longer than your client timeout you will abandon requests that they keep executing — duplicate
  work you will never see. They can tell you the real latency distribution and their own budget
  in one conversation, which is cheaper than your week of measurement, and they are the only
  party who can make retries safe by honoring an idempotency key.
