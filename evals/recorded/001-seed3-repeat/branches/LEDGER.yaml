  deadline because this is a cron, a batch job, or an offline pipeline where no caller is
  waiting on the result, then there is no budget to inherit, the invisible payer I named does
  not exist, and a long flat timeout with bounded concurrency is the cheaper answer. Reading
  the entry point settles it in ten minutes and costs nothing.
