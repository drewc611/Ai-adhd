# The document libraries the background model trains on.
#
# Checked in rather than passed on a command line, because a weekly job that takes a path argument
# trains on whatever the argument said that week, and a job that reads this file trains on
# something a diff can show changing.
#
# The first three entries are the repository's own prose and are always available, so a clean
# checkout can train and the pipeline is testable without a download. They are far too small to be
# a background corpus on their own: ~200KB of text against the 10^6-10^7 tokens modified
# Kneser-Ney needs to be worth reading. Point the fourth entry at a real library and enable it.
#
# Anything on disk works. A directory of PDFs converted to text, an export of internal design
# docs, a checkout of a documentation site, a JSONL dump with `jsonl_field` naming the text key.
# Nothing here downloads anything: if a corpus is not on this machine it does not exist, and a
# manifest naming a missing path fails loudly rather than training on the remainder.

corpora:
  - name: repo-docs
    path: ../docs
    include: ["**/*.md"]

  - name: repo-prompts
    path: ../prompts
    include: ["**/*.md", "**/*.txt"]

  - name: repo-readme
    path: ..
    include: ["README.md", "CLAUDE.md"]

  # The background corpus. `python scripts/fetch_corpus.py` puts it here; it is gitignored, so a
  # clean checkout has none and `required: false` keeps that checkout training on repository prose
  # instead of failing. CI caches it and the weekly job tops it up.
  #
  # RFCs and not novels, because the artifacts being scored are engineering arguments: a position,
  # its cost, what it forecloses, what would falsify it. That is the RFC genre almost exactly. A
  # model trained on literature would report that a branch artifact reads unlike a Victorian
  # novel, which is true and useless.
  - name: rfc
    path: corpora/rfc
    required: false
    include: ["*.txt"]

  # Anything else on disk. Replace `path` and set `enabled: true`.
  - name: library
    path: /path/to/your/documents
    enabled: false
    required: false
    include: ["**/*.md", "**/*.txt", "**/*.rst"]
    exclude: ["node_modules/**", ".git/**"]

  # A JSONL dump, the shape most public text corpora ship in. `jsonl_field` names the key holding
  # the document text; records without it are skipped rather than guessed at.
  - name: jsonl-dump
    path: /path/to/dump
    enabled: false
    required: false
    include: ["**/*.jsonl", "**/*.jsonl.gz"]
    jsonl_field: text
