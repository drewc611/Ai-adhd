[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adhd-analysis"
version = "0.1.0"
description = "Statistics over the ADHD recorded corpus. Reads evals/recorded/, never calls a model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
adhd-analysis = "adhd_analysis.report:main"

[tool.setuptools.packages.find]
include = ["adhd_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
