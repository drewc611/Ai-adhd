name: maintenance
# What a maintainer would run on a Monday, run every Monday.
#
# Every gate in test.yml plus the reports that are not gates, against the default branch rather
# than against a diff. The distinction matters: `eval --gate` compares a run to its own recorded
# expectation and stays green as the corpus ages around it, while `frames --health` and
# `frames --drift` describe a library nobody changed this week and can still start failing,
# because the standard they are measured against is the recorded runs.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.gates.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - id: gates
        continue-on-error: true
        run: |
          set -e
          node dist/src/cli.js validate
          node dist/src/cli.js doctor
          node dist/src/cli.js lint
          node dist/src/cli.js eval
          node dist/src/cli.js eval --gate
          node dist/src/cli.js replay
          node dist/src/cli.js frames --drift

      - name: library reports
        run: |
          {
            echo '## Library, this week'
            for cmd in "frames --health" "frames --axes" "frames --orthogonality" "frames --collisions" "eval --audit" "cost" "learn --correlation"; do
              echo "<details><summary><code>adhd $cmd</code></summary>"; echo
              echo '```'; node dist/src/cli.js $cmd || true; echo '```'
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Reported, never applied. An unattended job that bumps a dependency and merges it is a
      # supply-chain path into a repository whose whole claim is that it runs no untrusted code.
      - name: dependencies
        run: |
          {
            echo '## Dependencies'
            echo '```'; npm outdated || true; echo '```'
            echo '```'; npm audit --omit=dev || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: open or update the failure issue
        if: steps.gates.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "maintenance: a gate that passed last week is failing";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly maintenance run failed a gate on \`${context.sha.slice(0, 7)}\`.`,
              ``,
              `Nothing was pushed this week that CI rejected, so the failure is drift: a recorded`,
              `run, a frame definition, or a fixture assertion has moved out from under a check`,
              `that used to hold. \`replay\` and \`frames --drift\` are the two that do this.`,
              ``,
              `Run: ${url}`,
              ``,
              `---`,
              `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "maintenance",
            });
            const open = existing.data.find((i) => i.title === title);
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["maintenance"] });

      - if: steps.gates.outcome == 'failure'
        run: exit 1
