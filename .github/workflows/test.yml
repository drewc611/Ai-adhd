name: test
on:
  push:
  pull_request:
# The token needs nothing but the checkout. Stated explicitly so a future step cannot
# quietly inherit write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/src/cli.js validate
      - run: node dist/src/cli.js eval
      # Every recorded synthesis still renders from its own artifacts, or is in
      # evals/replay-baseline.json with a reason. Fails equally on a baseline entry that has
      # gone stale, because one that forgives drift no longer happening waves the next one through.
      - run: node dist/src/cli.js replay
      # config, prompts, agents, D4 tool grants, published entry points and the recorded corpus
      # all agree with each other. Warnings do not fail; errors do.
      - run: node dist/src/cli.js doctor
      # Fixture patterns compile, can fail, and use no bare dot as a separator.
      - run: node dist/src/cli.js lint
      # An assertion that used to hold on a run still holds on it. Finer than `eval`, which
      # compares a run against its own recorded expectation and so stays green as it degrades.
      - run: node dist/src/cli.js eval --gate

  # The corpus statistics. Separate job because it shares nothing with the TypeScript build: it
  # reads evals/recorded/ and writes text, nothing under src/ imports it, and it never runs during
  # a run. If this job ever needs the Node build to have happened first, that is the signal that
  # the D9 boundary has been crossed.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
        working-directory: analysis
      - run: pytest
        working-directory: analysis
      # The report runs end to end against the real corpus, so a loader change that drops a rater
      # or mis-joins a blind letter fails here rather than being discovered in a figure.
      - run: python -m adhd_analysis --root .. --json > /dev/null
        working-directory: analysis
