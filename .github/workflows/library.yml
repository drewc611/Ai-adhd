name: library
# The frame library and the prompts are the product. A change to either deserves the reports a
# reviewer would otherwise have to run by hand, which is why this is path-filtered and separate
# from test.yml: those reports are evidence, not gates, and turning them into gates would mean
# failing a PR for a co-clustering rate that docs/RETIREMENT.md explicitly says not to act on.
on:
  pull_request:
    paths:
      - "config/**"
      - "prompts/**"
      - "evals/fixtures/**"
      - "agents/**"

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Gates. These must pass: they say the library still describes itself correctly.
      - run: node dist/src/cli.js validate
      - run: node dist/src/cli.js doctor
      - run: node dist/src/cli.js lint
      - run: node dist/src/cli.js eval
      - run: node dist/src/cli.js eval --gate
      # docs/CONFIG.md is generated from the schemas. A config change that alters a field and
      # leaves the doc behind is exactly the drift this file is path-filtered to catch.
      - run: node dist/src/cli.js frames --drift

      # Reports. These are what a reviewer needs to read on a library change, and they are
      # deliberately not gates. `frames --orthogonality` exits non-zero on a flagged pair, and
      # the one pair it currently flags is one docs/RETIREMENT.md says to watch and not act on.
      - name: frame library reports
        run: |
          {
            echo '## Frame library, after this change'
            echo '<details><summary>orthogonality (D6)</summary>'; echo
            echo '```'; node dist/src/cli.js frames --orthogonality || true; echo '```'
            echo '</details>'
            echo '<details><summary>retirement health</summary>'; echo
            echo '```'; node dist/src/cli.js frames --health; echo '```'
            echo '</details>'
            echo '<details><summary>axis coverage</summary>'; echo
            echo '```'; node dist/src/cli.js frames --axes; echo '```'
            echo '</details>'
            echo '<details><summary>label collisions</summary>'; echo
            echo '```'; node dist/src/cli.js frames --collisions; echo '```'
            echo '</details>'
            echo '<details><summary>which assertions discriminate a run from its control</summary>'; echo
            echo '```'; node dist/src/cli.js eval --audit || true; echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
